<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The cover of "Run Claude Code and Codex side by side": main as one line,
       two branches rising from it into lanes of their own, each boxed as its
       worktree, and coming back onto main as a straight line at the wdx mark.
       Fonts: Bricolage Grotesque and JetBrains Mono, as the site's; render.sh
       loads them. -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#232836" /></pattern>
  </defs>
  <rect width="1200" height="630" fill="#13161c" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <text x="72" y="112" fill="#e9ecf2" font-family="Bricolage Grotesque" font-weight="800" font-size="60">Claude Code and Codex,</text>
  <text x="72" y="182" fill="#e9ecf2" font-family="Bricolage Grotesque" font-weight="800" font-size="60">side by side on one repo</text>
  <text x="74" y="232" fill="#98a1b3" font-family="JetBrains Mono" font-size="24">a worktree and a branch each, then land both on main</text>

  <!-- the two lanes -->
  <g font-family="JetBrains Mono">
    <rect x="300" y="282" width="470" height="92" rx="12" fill="#1e222a" stroke="#2e3443" stroke-width="2" />
    <text x="324" y="318" fill="#e9ecf2" font-weight="700" font-size="22">Claude Code</text>
    <text x="324" y="352" fill="#98a1b3" font-size="18">.worktrees/notes-delete</text>
    <rect x="300" y="500" width="470" height="92" rx="12" fill="#1e222a" stroke="#2e3443" stroke-width="2" />
    <text x="324" y="536" fill="#e9ecf2" font-weight="700" font-size="22">Codex</text>
    <text x="324" y="570" fill="#98a1b3" font-size="18">.worktrees/notes-search</text>
  </g>

  <!-- the branches: up into a lane and back onto main -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M72 437 H1012" stroke="#3a4152" />
    <path d="M200 437 C250 437 250 328 300 328 M770 328 C830 328 830 437 880 437" stroke="#6fd3c1" />
    <path d="M200 437 C250 437 250 546 300 546 M770 546 C870 546 870 437 960 437" stroke="#e2b75e" />
  </g>
  <g fill="#13161c" stroke-width="4">
    <circle cx="672" cy="328" r="10" stroke="#6fd3c1" />
    <circle cx="672" cy="546" r="10" stroke="#e2b75e" />
    <circle cx="200" cy="437" r="10" stroke="#98a1b3" />
    <circle cx="880" cy="437" r="10" stroke="#6fd3c1" />
    <circle cx="960" cy="437" r="10" stroke="#e2b75e" />
  </g>
  <text x="74" y="475" fill="#98a1b3" font-family="JetBrains Mono" font-size="18">main</text>

  <!-- the mark, where main goes on -->
  <g transform="translate(1036 384) scale(1.2)">
    <polyline points="5.5,46 13,76 20.5,50 28,76 35.5,46" fill="none" stroke="#e9ecf2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59.5" cy="64" r="12" fill="none" stroke="#e9ecf2" stroke-width="8" />
    <line x1="71.5" y1="42" x2="71.5" y2="76" stroke="#e9ecf2" stroke-width="8" stroke-linecap="round" />
    <line x1="78.5" y1="14" x2="94.5" y2="30" stroke="#6fd3c1" stroke-width="7" stroke-linecap="round" />
    <line x1="94.5" y1="14" x2="78.5" y2="30" stroke="#6fd3c1" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
