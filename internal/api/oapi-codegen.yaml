package: api
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: true
compatibility:
  always-prefix-enum-values: true
  # Keeps operationIds in the embedded spec as written: they label metrics.
  preserve-original-operation-id-casing-in-embedded-spec: true
