package: hubapi
output: hubapi.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: true
compatibility:
  always-prefix-enum-values: true
  # Keeps operationIds in the embedded spec as written: they label metrics.
  preserve-original-operation-id-casing-in-embedded-spec: true
output-options:
  # The control messages travel over the WebSocket, so no operation names
  # them: keep the schemas no operation uses.
  skip-prune: true
