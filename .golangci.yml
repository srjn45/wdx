# golangci-lint: `make lint` and CI run it at the version pinned in the
# Makefile. Besides the usual correctness linters, depguard, forbidigo,
# sloglint and paralleltest enforce the rules of AGENTS.md.
version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nolintlint
    - paralleltest
    - sloglint
  settings:
    depguard:
      rules:
        # The cli reaches the domain only through the API; add each new
        # domain package here.
        cli-through-api:
          files: ["**/internal/cli/**"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/project
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/git$
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/gh$
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/terminal
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/agent
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/worktree
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/doc
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/plan
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/tidestate
              desc: the cli calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/proc
              desc: the cli calls the daemon's API, which stops processes
            - pkg: github.com/srjn45/wdx/internal/fswatch
              desc: the cli calls the daemon's API; the daemon watches the files
            - pkg: github.com/srjn45/wdx/internal/nodeaudit
              desc: the cli calls the daemon's API, which verifies the node's audit chain
        # The command framework knows no program: its name, codes, settings
        # and errors come in through clikit.Env.
        clikit-knows-no-program:
          files: ["**/internal/clikit/**"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/identity
              desc: clikit knows no program; take its name from clikit.Env
            - pkg: github.com/srjn45/wdx/internal/api
              desc: clikit knows no program; take its codes and problems from clikit.Env
            - pkg: github.com/srjn45/wdx/internal/config
              desc: clikit knows no program; take its settings from clikit.Env
            - pkg: github.com/srjn45/wdx/internal/client
              desc: clikit knows no program; it calls no server
            - pkg: github.com/srjn45/wdx/internal/daemon
              desc: clikit knows no program; it runs no server
            - pkg: github.com/srjn45/wdx/internal/project
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/git$
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/gh$
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/terminal
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/agent
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/worktree
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/doc
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/plan
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/tidestate
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/proc
              desc: clikit knows no program, nor its domain
            - pkg: github.com/srjn45/wdx/internal/fswatch
              desc: clikit knows no program, nor its domain
        # The holder stays free of ACA code: it is given a parser, by the cli.
        holder-without-aca:
          files: ["**/internal/holder/*.go", "!$test"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/aca
              desc: the holder is given a function to read the screen with; docs/AGENT_STATE.md
        vt-in-screen-only:
          files:
            - "$all"
            - "!**/internal/screen/**"
          deny:
            - pkg: github.com/charmbracelet/x/vt
              desc: only internal/screen uses the vt, so its fork is one replace
        glamour-in-tide-only:
          files:
            - "$all"
            - "!**/internal/tide/**"
          deny:
            - pkg: charm.land/glamour
              desc: only tide renders Markdown; the wdx doc TIDE_MARKDOWN
        # Dependencies point down: only the cli runs the daemon and calls
        # it through the client; tide is a client too, with its own rule.
        daemon-and-client-in-cli-only:
          files:
            - "$all"
            - "!**/cmd/wdx/**"
            - "!**/internal/cli/**"
            - "!**/internal/tide/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/daemon$
              desc: only the cli runs the daemon; the domain never calls up
            - pkg: github.com/srjn45/wdx/internal/client$
              desc: only the cli calls the daemon's API
        # tide is a client of the daemon's API, as the cli is; its tests
        # run a daemon in the test process, as the cli's do.
        tide-through-api:
          files: ["**/internal/tide/**", "!$test"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/daemon
              desc: tide calls the daemon's API, never the daemon
        tide-not-domain:
          files: ["**/internal/tide/**"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/project
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/git$
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/gh$
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/terminal
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/agent
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/worktree
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/tidestate
              desc: tide keeps its state through the daemon's API, which keeps it here
            - pkg: github.com/srjn45/wdx/internal/plan
              desc: tide calls the daemon's API, never the domain
            - pkg: github.com/srjn45/wdx/internal/db$
              desc: tide calls the daemon's API, never the database
            - pkg: github.com/srjn45/wdx/internal/sqlite$
              desc: tide calls the daemon's API, never the database
            - pkg: github.com/srjn45/wdx/internal/proc
              desc: tide calls the daemon's API, which stops processes
            - pkg: github.com/srjn45/wdx/internal/authcode
              desc: tide calls the daemon's API; the code is set up with the cli alone
            - pkg: github.com/srjn45/wdx/internal/nodeaudit
              desc: tide calls the daemon's API, never the domain
        # The editors are data the settings, wdx deps, the daemon and tide share.
        editor-is-data:
          files: ["**/internal/editor/*.go", "!$test"]
          deny:
            - pkg: github.com/srjn45/wdx/
              desc: internal/editor depends on nothing, so that any package may use it
        config-in-cli-only:
          files:
            - "$all"
            - "!**/cmd/wdx/**"
            - "!**/internal/cli/**"
            - "!**/internal/config/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/config
              desc: only cmd and cli hold the Config; pass packages the values they need
            - pkg: github.com/srjn45/wdx/internal/cli$
              desc: only cmd/wdx runs the cli
        settings-in-cli-only:
          files:
            - "$all"
            - "!**/cmd/wdx/**"
            - "!**/internal/cli/**"
            - "!**/internal/config/**"
            - "!**/internal/clikit/**"
            - "!**/cmd/wdx-hub/**"
            - "!**/internal/hub/hubcli/**"
            - "!**/internal/hub/hubconfig/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/settings
              desc: only cmd, the cli, config and clikit, and the hub's hubcli and hubconfig, read settings; the daemon and the domain are handed the values they need
        # The hub builds on the generic packages only (the wdx doc HUB_SKELETON),
        # never on wdx's commands, daemon, settings, database or domain.
        hub-not-wdx:
          files: ["**/internal/hub/**", "**/internal/hubapi/**"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/cli$
              desc: the hub builds on clikit, settings and sqlite, never on wdx's commands
            - pkg: github.com/srjn45/wdx/internal/daemon$
              desc: the hub builds on clikit, settings and sqlite, never on wdx's daemon
            - pkg: github.com/srjn45/wdx/internal/client$
              desc: the hub builds on clikit, settings and sqlite, never on wdx's client
            - pkg: github.com/srjn45/wdx/internal/config$
              desc: the hub builds on clikit, settings and sqlite, never on wdx's settings; the hub's are hubconfig
            - pkg: github.com/srjn45/wdx/internal/db
              desc: the hub builds on clikit, settings and sqlite, never on wdx's database; the hub's is hubdb
            - pkg: github.com/srjn45/wdx/internal/project
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/git$
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/gh$
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/terminal
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/agent
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/worktree
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/doc
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/plan
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/tidestate
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/proc
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/fswatch
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/holder
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/aca
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
            - pkg: github.com/srjn45/wdx/internal/authcode
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package; the node's code never reaches the hub
            - pkg: github.com/srjn45/wdx/internal/nodeaudit
              desc: the hub builds on clikit, settings and sqlite, never on a wdx domain package
        # seal is a few lines of the standard library's crypto, so that what
        # guards the hub's secrets at rest is read whole (the wdx doc
        # HUB_ACCOUNTS).
        seal-standard-library-only:
          files: ["**/internal/hub/seal/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
        # Only wdx-hub uses the hub; wdx's tests serve one through hubtest,
        # by the next rule (the wdx doc HUB_LOGIN).
        hub-in-wdx-hub-only:
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/wdx-hub/**"
            - "!**/internal/hub/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/hub/
              desc: only wdx-hub uses the hub; wdx's tests may serve one through internal/hub/hubtest
        # wdx's tests may serve a hub, through hubtest alone.
        hubtest-in-wdx-tests:
          files:
            - "$test"
            - "!**/cmd/wdx-hub/**"
            - "!**/internal/hub/**"
          list-mode: lax
          allow:
            - github.com/srjn45/wdx/internal/hub/hubtest
          deny:
            - pkg: github.com/srjn45/wdx/internal/hub/
              desc: wdx's tests serve a hub through internal/hub/hubtest alone
        # The daemon serves the hub's nodes, as hublink gives them.
        hubapi-in-hub-and-link:
          files:
            - "$all"
            - "!**/cmd/wdx-hub/**"
            - "!**/internal/hub/**"
            - "!**/internal/hublink/**"
            - "!**/internal/daemon/*.go"
          deny:
            - pkg: github.com/srjn45/wdx/internal/hubapi
              desc: only wdx-hub, hublink and the daemon serving its routes use the hub's API
        # The daemon holds the node's one link to the hub, and remote its
        # streams for the daemon; the cli reaches both through the daemon's
        # /v1/hub routes.
        hublink-in-daemon-only:
          files:
            - "$all"
            - "!**/internal/daemon/**"
            - "!**/internal/hublink/**"
            - "!**/internal/remote/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/hublink
              desc: only the daemon, and remote for it, use hublink; others call the daemon's /v1/hub routes
        # Sessions between one's own nodes are the daemon's (the wdx doc
        # HUB_TUNNEL); the cli opens and closes them through its API.
        remote-in-daemon-only:
          files:
            - "$all"
            - "!**/internal/daemon/**"
            - "!**/internal/remote/**"
          deny:
            - pkg: github.com/srjn45/wdx/internal/remote
              desc: only the daemon uses remote; others call the daemon's /v1/hub/sessions routes
        # remote is what lets another node in, so what it builds on is kept
        # short and read whole: the link, CPace, the code, the audit chain
        # and the database, and no other domain package.
        remote-not-domain:
          files: ["**/internal/remote/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - filippo.io/cpace
            - github.com/srjn45/wdx/internal/hublink
            - github.com/srjn45/wdx/internal/authcode
            - github.com/srjn45/wdx/internal/nodeaudit
            - github.com/srjn45/wdx/internal/atomicfile
            - github.com/srjn45/wdx/internal/db
            - github.com/srjn45/wdx/internal/sqlite
            - github.com/srjn45/wdx/internal/identity
            - github.com/srjn45/wdx/internal/logging
        # update serves wdx and wdx-hub alike: each describes itself in an
        # update.Program, so update knows neither's names, paths or database.
        update-knows-no-program:
          files: ["**/internal/update/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/srjn45/wdx/internal/atomicfile
            - github.com/srjn45/wdx/internal/logging
            - github.com/srjn45/wdx/internal/sqlite
        # hublink speaks to the hub through its API alone.
        hublink-not-hub:
          files: ["**/internal/hublink/*.go", "!$test"]
          deny:
            - pkg: github.com/srjn45/wdx/internal/hub/
              desc: hublink speaks to the hub through hubapi alone
    errcheck:
      # Errors these return have nothing left to handle: a rollback after
      # the commit, a response the client stopped reading, a completion or
      # required flag that TestCommandDocs checks.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*encoding/json.Encoder).Encode
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: only main reads the environment; take the value from the Config
        - pattern: ^os\.(Environ|UserHomeDir)$
          msg: only main and tests read the whole environment; take it from cli.Env
        - pattern: ^os\.Chdir$
          msg: paths are absolute; never change the working directory
        - pattern: ^testing\.(T|B|TB)\.Setenv$
          msg: tests run in parallel; pass settings in through cli.Env
        - pattern: ^log\.
          msg: log with logging.FromContext(ctx)
        - pattern: ^time\.Sleep$
          msg: tests wait on what they need with waittest, never a fixed time
        - pattern: ^time\.Since$
          msg: a test's outcome never depends on how long something took
        - pattern: ^time\.(Until|After|NewTimer|Tick|NewTicker)$
          msg: wait until waittest.Deadline(t)
        - pattern: ^context\.WithTimeout$
          msg: wait until waittest.Deadline(t)
    gosec:
      excludes:
        # errcheck checks unhandled errors, with its own exclusions.
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-global: all
      # logging.Duration is an attribute among key-value pairs.
      no-mixed-args: false
      key-naming-case: snake
      msg-style: lowercased
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/wdx(-hub)?/main\.go$
        linters: [forbidigo]
        text: only main (and tests )?reads? the
      # Tests and their helpers pass the test process's environment on to
      # the processes they start, and set it up for git.
      - path: (_test\.go$|^internal/gittest/|^internal/holder/holdertest/|^internal/runtest/)
        linters: [forbidigo]
        text: only main and tests read the whole environment
      # Only tests are held to these: code waits and measures as it must.
      - path-except: _test\.go$
        linters: [forbidigo]
        text: (never a fixed time|how long something took|wait until waittest\.Deadline)
      # The tests' request helpers read and close the body themselves.
      - path: _test\.go$
        linters: [bodyclose]
      # gosec is for what reaches users: tests, their helpers and the
      # developer's scripts write temporary files and run what they built.
      - path: (_test\.go$|^internal/([a-z]+/)*[a-z]*test/|^scripts/)
        linters: [gosec]
      # wdx runs on the user's machine as the user: it opens the files of its
      # home, the user's checkouts and the paths given to it, and runs the
      # programs it is for (git, shells, the ACAs, editors) with arguments,
      # never through a shell. The hub, a server, is held to both.
      - path-except: ^internal/hub/
        linters: [gosec]
        text: ^(G204|G304)

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/srjn45/wdx
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
