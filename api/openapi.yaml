openapi: 3.0.3
info:
  title: wdx daemon API
  version: v1
  description: |
    The API of the wdx daemon, served over the Unix socket <home>/wdx.sock.

    A request may send a Wdx-Debug-Id header (dbg- and 12 hex digits) to have
    the daemon log it under that id; the response echoes the id the request
    was logged under. A Wdx-Log-Level header of debug has the daemon log the
    request at debug level, its failures excepted, as for tab completions;
    any other value is ignored.

    Errors are Problem Details (RFC 9457) with a stable "code"; each
    operation lists the codes it can return besides usage and internal.
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Version of the daemon
      responses:
        "200":
          description: The name, version and commit the daemon was built from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/daemon:
    get:
      operationId: getDaemon
      summary: The daemon serving this socket
      responses:
        "200":
          description: Its build, process, home and socket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daemon" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects, without their worktrees, sorted by name
      parameters:
        - name: state
          in: query
          description: Only projects in this state; every project when absent.
          schema: { $ref: "#/components/schemas/ProjectState" }
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: Create a project or open a git repository as one
      description: |
        source.type picks what happens:
        - new: create an empty git repository at <path>/<name> (path defaults
          to <home>/projects) and open it. An existing directory that is not
          in a git repository is initialized in place. When the name is taken
          or the directory is in a git repository, on_conflict "open" opens
          that project instead and returns the conflict under "conflict";
          without it the conflict is returned as the error.
        - local: open the repository holding path. Worktrees and other clones
          of a known repository join its project.
        - git: open the project with that origin, or clone it into
          <home>/projects/<name> if it is unknown.

        Opening a known project marks it open, drops its checkouts no longer
        on disk and relaunches the terminals closing it stopped, listing them
        under "started". When no checkout is left, on_missing_checkout
        "reclone" clones it again and "remove" removes it, which terminals
        still running refuse with project_in_use; without it checkout_missing
        is returned.

        Errors: checkout_missing, clone_failed, invalid_argument,
        invalid_name, invalid_path, name_taken, not_git_repo, path_exists,
        project_in_use, project_mismatch, repo_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "200":
          description: An existing project was opened, or removed by on_missing_checkout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        "201":
          description: A project was created, registered or cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: getProject
      summary: A project, open or closed, with which of its checkouts are on disk and its terminals
      description: "Errors: not_found."
      responses:
        "200":
          description: The project, with "present" on each worktree, "orphaned" and "terminals" set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      summary: Close a project, or open it again from one of its checkouts
      description: |
        Closing touches nothing on disk. It stops the project's terminals that
        are starting or running, which it refuses with project_in_use unless
        stop_running is true, and lists them under "stopped".

        Opening drops the checkouts no longer on disk; when none is left,
        checkout_missing is returned. It relaunches the terminals closing
        stopped and lists them under "started", each in the state it reached.

        Errors: checkout_missing, not_found, project_in_use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: The project, with result closed or opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProject
      summary: Delete a project and everything that belongs to it
      description: |
        Files on disk are not touched. Terminals starting or running refuse
        it with project_in_use unless stop_running is true, which stops them
        first and lists them under "stopped".

        Errors: not_found, project_in_use.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed project, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: streamProject
      summary: Follow a project, sent whole every time it changes
      description: |
        Server-sent events (text/event-stream) for as long as the client
        stays. The first event is the project as getProject returns it;
        after every change under it (the project opened or closed, a
        terminal created, changing state or removed, whoever made it) the
        project is sent whole again, never a delta, so a client replaces
        what it holds. Changes close together may be sent as one.

        Each event is "event: project" with a ProjectEnvelope as its data.
        When the project is removed, "event: removed" with a ProjectRemoved
        ends the stream. The project is followed by its id, so a rename
        keeps it. The stream also ends when the daemon stops.

        Errors: not_found.
      responses:
        "200":
          description: The stream of the project's events.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/worktrees:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    post:
      operationId: recloneProject
      summary: Clone a project with no checkout left back into its clone path
      description: |
        Relaunches the terminals closing the project stopped, as opening it
        does.

        Errors: clone_failed, invalid_argument, not_found, path_exists.
      responses:
        "201":
          description: The project, with result cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals:
    get:
      operationId: listTerminals
      summary: List terminals by project name, then name
      description: |
        The terminals of the project named by project, or of the project whose
        worktree holds dir; of every project when neither is given.

        Errors: invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
      responses:
        "200":
          description: The terminals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTerminal
      summary: Create a terminal and start its shell
      description: |
        Without project, the terminal belongs to the project whose worktree
        holds dir, the longest path winning, and its shell starts in dir.
        With project, it starts in dir when dir is in one of the project's
        worktrees, else in the project's clone path.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_name, invalid_path, name_taken, not_found,
        project_closed, start_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTerminal" }
      responses:
        "201":
          description: The terminal, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminal
      summary: A terminal, in any state
      description: "Errors: invalid_path, not_found."
      responses:
        "200":
          description: The terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTerminal
      summary: Delete a terminal
      description: |
        A terminal starting or running refuses it with terminal_running
        unless stop_running is true, which stops its shell first.

        Errors: invalid_path, not_found, terminal_running.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed terminal, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/start:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: startTerminal
      summary: Start a fresh shell for a terminal whose last one ended
      description: |
        For a terminal that exited, failed or was lost; never for one stopped
        by closing its project, which opening it relaunches.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_path, not_found, project_closed, start_failed, terminal_running.
      responses:
        "200":
          description: The terminal, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/history:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminalHistory
      summary: Lines of a terminal's history, in any state
      description: |
        History is the lines that scrolled off the terminal's screen,
        numbered from 0 for the terminal's life, across relaunches of its
        shell, and kept up to terminal.history_lines. With from or count,
        the count lines from that number on, from 0 when not given; else
        the last tail lines. A from before the oldest line kept starts at
        that one.

        Errors: invalid_path, not_found; tail with from or count is a usage
        error.
      parameters:
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHistoryEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    ProjectRef:
      name: project
      in: path
      required: true
      description: The project's name (case-insensitive), or "id:" and its id, as in id:proj-1a2b3c4d.
      schema: { type: string, minLength: 1 }
    TerminalRef:
      name: terminal
      in: path
      required: true
      description: |
        "id:" and the terminal's id, as in id:term-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    TerminalProject:
      name: project
      in: query
      description: The project's name, or "id:" and its id; excludes dir.
      schema: { type: string, minLength: 1 }
    TerminalDir:
      name: dir
      in: query
      description: An absolute path in one of the project's worktrees; excludes project.
      schema: { type: string, minLength: 1 }
    StopRunning:
      name: stop_running
      in: query
      description: Stop the terminals that are starting or running instead of refusing.
      schema: { type: boolean, default: false }

  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Version:
      type: object
      required: [name, version, commit]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }

    Daemon:
      type: object
      required: [name, version, commit, pid, home, socket, started_at]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }
        pid: { type: integer }
        home: { type: string }
        socket: { type: string }
        started_at: { type: string, format: date-time }

    ProjectState:
      type: string
      enum: [open, closed]

    Result:
      type: string
      description: The most significant thing that happened.
      enum: [created, registered, cloned, opened, closed, removed, started, detached, exited]

    Worktree:
      type: object
      required: [id, path, created_at]
      properties:
        id: { type: string }
        path: { type: string }
        present:
          type: boolean
          description: Whether the checkout is on disk; set by getProject only.
        created_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, origin, state, worktrees, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        orphaned:
          type: boolean
          description: Whether none of the checkouts is on disk; set by getProject only.
        worktrees:
          type: array
          items: { $ref: "#/components/schemas/Worktree" }
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }
          description: The project's terminals by name, in every state; set by getProject only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectSummary:
      type: object
      required: [id, name, origin, state, worktree_count, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        worktree_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }

    ProjectEnvelope:
      type: object
      required: [project]
      properties:
        project: { $ref: "#/components/schemas/Project" }

    ProjectRemoved:
      type: object
      description: The data of streamProject's removed event.
      required: [project_id]
      properties:
        project_id: { type: string }

    ProjectResult:
      type: object
      required: [result, project]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        project: { $ref: "#/components/schemas/Project" }
        dropped:
          type: array
          description: The checkouts dropped because they are no longer on disk.
          items: { $ref: "#/components/schemas/Worktree" }
        conflict:
          $ref: "#/components/schemas/Problem"
        started:
          type: array
          description: The terminals opening the project relaunched, in the state each reached.
          items: { $ref: "#/components/schemas/Terminal" }
        stopped:
          type: array
          description: The terminals closing or removing the project stopped.
          items: { $ref: "#/components/schemas/Terminal" }

    CreateProject:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Source" }
        name:
          type: string
          description: Required for source new; otherwise the repository directory or URL name by default.
        on_conflict:
          type: string
          enum: [open, cancel]
        on_missing_checkout:
          type: string
          enum: [reclone, remove]

    Source:
      oneOf:
        - $ref: "#/components/schemas/NewSource"
        - $ref: "#/components/schemas/LocalSource"
        - $ref: "#/components/schemas/GitSource"
      discriminator:
        propertyName: type
        mapping:
          new: "#/components/schemas/NewSource"
          local: "#/components/schemas/LocalSource"
          git: "#/components/schemas/GitSource"

    NewSource:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [new] }
        path:
          type: string
          description: Absolute directory to create the repository in; <home>/projects by default.

    LocalSource:
      type: object
      required: [type, path]
      additionalProperties: false
      properties:
        type: { type: string, enum: [local] }
        path:
          type: string
          description: Absolute path in a git repository.

    GitSource:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: { type: string, enum: [git] }
        url: { type: string, description: Clone URL. }

    UpdateProject:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { $ref: "#/components/schemas/ProjectState" }
        stop_running:
          type: boolean
          description: With state closed, stop the terminals that are starting or running instead of refusing.

    TerminalState:
      type: string
      description: |
        starting: its holder is being started; running: its shell is alive;
        exited: its shell ended by itself; stopped: closing its project
        stopped it; failed: its holder or shell did not start; lost: its
        holder is gone and nobody stopped it.
      enum: [starting, running, exited, stopped, failed, lost]

    Terminal:
      type: object
      required: [id, name, project_id, project_name, dir, shell, state, pid, exit_code, error, created_at, updated_at, started_at, ended_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        dir: { type: string, description: "Where the shell starts, now and on every relaunch." }
        shell: { type: string, description: Absolute path of the shell. }
        state: { $ref: "#/components/schemas/TerminalState" }
        pid: { type: integer, nullable: true, description: "The shell's, while it has one." }
        exit_code:
          type: integer
          nullable: true
          description: Only when exited; 128 and the signal for a shell killed by one.
        error: { type: string, nullable: true, description: Only when failed; why it did not start. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When its state last changed. }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }

    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }

    TerminalEnvelope:
      type: object
      required: [terminal]
      properties:
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalResult:
      type: object
      required: [result, terminal]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalHistory:
      type: object
      required: [from, next, first, lines]
      properties:
        from: { type: integer, format: int64, description: The number of the first line in lines. }
        next: { type: integer, format: int64, description: The number the next line written will take. }
        first: { type: integer, format: int64, description: The number of the oldest line kept. }
        lines:
          type: array
          description: The lines as the terminal drew them, with their escape codes for styles and links.
          items: { type: string }

    TerminalHistoryEnvelope:
      type: object
      required: [history]
      properties:
        history: { $ref: "#/components/schemas/TerminalHistory" }

    CreateTerminal:
      type: object
      required: [dir]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; by default the one whose worktree holds dir.
        dir:
          type: string
          description: Absolute path the shell starts in; see createTerminal.
        name:
          type: string
          nullable: true
          description: A generated adjective-noun codename by default.

    ErrorCode:
      type: string
      description: |
        Stable error code; never changed or reused. daemon_unavailable,
        already_running, runtime_missing, port_in_use, runtime_failed,
        terminal_not_running, attach_unsupported, connection_lost and the
        codes of wdx update (download_failed to restore_required) are
        reported by the CLI, never by the daemon.
      enum:
        - usage
        - internal
        - not_found
        - name_taken
        - repo_exists
        - checkout_missing
        - not_git_repo
        - invalid_name
        - invalid_path
        - invalid_argument
        - path_exists
        - project_mismatch
        - clone_failed
        - project_closed
        - project_in_use
        - terminal_running
        - start_failed
        - terminal_not_running
        - attach_unsupported
        - connection_lost
        - daemon_unavailable
        - already_running
        - runtime_missing
        - port_in_use
        - runtime_failed
        - download_failed
        - checksum_mismatch
        - older_version
        - update_running
        - update_failed
        - no_previous_version
        - restore_required
        - settings_invalid

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457).
      required: [type, title, status, detail, code, hint, details, debug_id]
      properties:
        type: { type: string, description: "urn:wdx:error: and the code." }
        title: { type: string, description: What the code means. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        hint: { type: string, nullable: true, description: What to do about it. }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: The values involved, such as the conflicting project.
        debug_id: { type: string, description: Finds the request's log lines. }
