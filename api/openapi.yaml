openapi: 3.0.3
info:
  title: wdx daemon API
  version: v1
  description: |
    The API of the wdx daemon, served over the Unix socket <home>/wdx.sock.

    A request may send a Wdx-Debug-Id header (dbg- and 12 hex digits) to have
    the daemon log it under that id; the response echoes the id the request
    was logged under. A Wdx-Log-Level header of debug has the daemon log the
    request at debug level, its failures excepted, as for tab completions;
    any other value is ignored.

    Errors are Problem Details (RFC 9457) with a stable "code"; each
    operation lists the codes it can return besides usage and internal.
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Version of the daemon
      responses:
        "200":
          description: The name, version and commit the daemon was built from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/daemon:
    get:
      operationId: getDaemon
      summary: The daemon serving this socket
      responses:
        "200":
          description: Its build, process, home and socket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daemon" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/daemon/reload:
    post:
      operationId: reloadDaemon
      summary: Read the settings again and apply them
      description: |
        Terminals already running keep their shell and history limit. When the
        config file cannot be used, the daemon keeps the values it has and
        fails with reload_failed. It does not wait for other changes in
        flight, since a clone can take minutes.
      responses:
        "200":
          description: The settings were applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings:
    get:
      operationId: listSettings
      summary: Every setting, with its value in the config file now
      description: "Errors: reload_failed, when the config file cannot be used."
      responses:
        "200":
          description: The settings, in the order of their table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/{setting}:
    parameters:
      - name: setting
        in: path
        required: true
        description: The setting's dotted key, such as log.level.
        schema: { type: string }
    patch:
      operationId: updateSetting
      summary: Change a setting and apply it at once
      description: |
        The value is checked, saved in the config file, then applied as
        reloadDaemon applies it, even when it is what the file has. The file is
        written anew, so comments of its own are not kept. It does not wait for
        other changes in flight, since a clone can take minutes.

        Errors: invalid_setting, not_found, reload_failed, when the value was
        saved but the daemon cannot apply the file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSetting" }
      responses:
        "200":
          description: The setting, with result updated, or unchanged when the file already had it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects, without their worktrees, sorted by name
      parameters:
        - name: state
          in: query
          description: Only projects in this state; every project when absent.
          schema: { $ref: "#/components/schemas/ProjectState" }
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: Create a project or open a git repository as one
      description: |
        source.type picks what happens:
        - new: create an empty git repository at <path>/<name> (path defaults
          to <home>/projects) and open it. An existing directory that is not
          in a git repository is initialized in place. When the name is taken
          or the directory is in a git repository, on_conflict "open" opens
          that project instead and returns the conflict under "conflict";
          without it the conflict is returned as the error.
        - local: open the repository holding path. Worktrees and other clones
          of a known repository join its project.
        - git: open the project with that origin, or clone it into
          <home>/projects/<name> if it is unknown.

        Opening a known project marks it open, drops its checkouts no longer
        on disk and relaunches the terminals and agents closing it stopped, listing
        them under "started" and "started_agents". When no checkout is left, on_missing_checkout
        "reclone" clones it again and "remove" removes it, which terminals
        and agents still running refuse with project_in_use; without it checkout_missing
        is returned.

        Errors: checkout_missing, clone_failed, invalid_argument,
        invalid_name, invalid_path, name_taken, not_git_repo, path_exists,
        project_in_use, project_mismatch, repo_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "200":
          description: An existing project was opened, or removed by on_missing_checkout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        "201":
          description: A project was created, registered or cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: getProject
      summary: A project, open or closed, with which of its checkouts are on disk and its terminals and agents
      description: "Errors: not_found."
      responses:
        "200":
          description: The project, with "present" on each worktree, "orphaned", "terminals" and "agents" set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      summary: Close a project, or open it again from one of its checkouts
      description: |
        Closing touches nothing on disk. It stops the project's terminals,
        agents and editors that are starting or running, which it refuses with
        project_in_use unless stop_running is true, and lists them under
        "stopped", "stopped_agents" and "stopped_editors".

        Opening drops the checkouts no longer on disk; when none is left,
        checkout_missing is returned. It relaunches the terminals and agents
        closing stopped and lists them under "started" and "started_agents",
        each in the state it reached.

        Errors: checkout_missing, not_found, project_in_use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: The project, with result closed or opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProject
      summary: Delete a project and everything that belongs to it
      description: |
        Files on disk are not touched, but for the copies of its docs in the
        daemon's home, which go with them. Terminals starting or running refuse
        it with project_in_use unless stop_running is true, which stops them
        first and lists them under "stopped".

        Errors: not_found, project_in_use.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed project, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: streamProject
      summary: Follow a project, sent whole every time it changes
      description: |
        Server-sent events (text/event-stream) for as long as the client
        stays. The first event is the project as getProject returns it;
        after every change under it (the project opened or closed, a
        terminal created, changing state or removed, a doc created, changed
        or removed, whoever made it) the project is sent whole again, never a
        delta, so a client replaces what it holds. Changes close together may be sent as one.

        Each event is "event: project" with a ProjectEnvelope as its data.
        When the project is removed, "event: removed" with a ProjectRemoved
        ends the stream. The project is followed by its id, so a rename
        keeps it. The stream also ends when the daemon stops.

        With worktrees, each event also has "worktree_statuses", once they
        are read. Only while such a stream is open does the daemon read them,
        and only when something says they changed: it runs no git on a timer.

        Errors: not_found.
      parameters:
        - name: worktrees
          in: query
          description: Keep "worktree_statuses" up to date in the events.
          schema: { type: boolean }
      responses:
        "200":
          description: The stream of the project's events.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/worktrees:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    post:
      operationId: recloneProject
      summary: Clone a project with no checkout left back into its clone path
      description: |
        Relaunches the terminals closing the project stopped, as opening it
        does.

        Errors: clone_failed, invalid_argument, not_found, path_exists.
      responses:
        "201":
          description: The project, with result cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/worktrees/refresh:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    post:
      operationId: refreshWorktrees
      summary: Read the "worktree_statuses" of a project's streams again now
      description: |
        Answers at once: the streams send what it finds. It does nothing when
        no stream with worktrees follows the project. Unlike the reads that
        happen by themselves, it does not wait for an index lock.

        Errors: not_found.
      parameters:
        - name: worktree
          in: query
          description: The worktree's name; all of them when not given or not known.
          schema: { type: string }
        - name: pull_requests
          in: query
          description: Have gh say how their pull requests stand too, which uses the network. The streams send what it finds.
          schema: { type: boolean }
      responses:
        "202": { description: The read was asked for. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/landing:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: getProjectLanding
      summary: How a project lands its worktrees
      description: |
        "configured" is false until it is set: landing needs it.

        Errors: not_found.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLanding" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setProjectLanding
      summary: Set how a project lands its worktrees
      description: |
        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectLandingUpdate" }
      responses:
        "200":
          description: The settings, with result updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLanding" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/tabs:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    put:
      operationId: replaceTabs
      summary: Replace the tabs tide has open in a project
      description: |
        tide's alone, which the CLI does not show (docs/TIDE_STATE.md). The
        list given becomes the project's whole list, in its order, in one step;
        an open or closed project alike. A removal made through wdx takes the
        tabs of what it removed by itself. The project's stream carries them.
        An agent kept as a tombstone is still the project's: the tabs open when
        it became one were closed then, and one opened after stays.

        Errors: invalid_argument (a tab's kind with the wrong fields, the same
        tab twice, an agent or a doc that is not the project's), not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabsUpdate" }
      responses:
        "200":
          description: The tabs, with result updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabsResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/view:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: getProjectView
      summary: Read what tide shows of a project besides its tabs
      description: |
        tide's alone, which the CLI does not show (docs/TIDE_STATE.md). {}
        when none was saved.

        Errors: not_found.
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceProjectView
      summary: Replace what tide shows of a project besides its tabs
      description: |
        Kept as given, as the daemon reads nothing in it. It neither waits for
        other changes nor wakes the project's streams, which do not carry it.

        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/View" }
      responses:
        "200":
          description: The view, with result updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/tide/view:
    get:
      operationId: getTideView
      summary: Read what tide shows as a whole, such as the project shown
      description: |
        tide's alone, which the CLI does not show (docs/TIDE_STATE.md). {}
        when none was saved.
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceTideView
      summary: Replace what tide shows as a whole
      description: |
        Kept as given, as the daemon reads nothing in it. It does not wait for
        other changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/View" }
      responses:
        "200":
          description: The view, with result updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees:
    get:
      operationId: listWorktrees
      summary: List every checkout git lists for a project, with its changes
      description: |
        The checkouts of the project named by project, or of the project whose
        worktree holds dir; one of them must be given. Read from git now, without
        writing to the repository or downloading anything.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
      responses:
        "200":
          description: The worktrees.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    delete:
      operationId: removeWorktree
      summary: Remove a worktree that landed
      description: |
        Only one with nothing ahead of its base and nothing uncommitted, or one
        whose directory is already gone, where only git's entry goes. Its branch
        goes too if it is merged. Agents running there are told where to go on, and
        do not hold it up. Editors running there are stopped, with what they hold
        unsaved. Terminals running there are left as they are.

        A slot of a plan going on is refused: worktree_in_plan, with the plan
        under details.plan.

        Errors: invalid_path, not_found, usage, worktree_in_plan,
        worktree_is_clone, worktree_not_landed, worktree_not_removed.
      responses:
        "200":
          description: What went, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeRemoved" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/land:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    post:
      operationId: landWorktree
      summary: Start landing a worktree on its base
      description: |
        By rebase, it rebases if the base has moved on, runs the project's check,
        moves the base forward to the commit checked and pushes it if the project
        says so. By PR, it runs the check, pushes the branch and opens a PR, or adds
        to the one open. It goes on in the background: "landing" in the worktree's
        status says how far it got and how it ended, in the codes base_moved,
        check_failed, fast_forward_failed, pr_failed, push_failed and rebase_failed.
        Each leaves the base where it was. A slot of a plan going on is refused, as
        the plan lands its tasks itself: worktree_in_plan, with the plan under
        details.plan.

        Errors: agent_working, dependency_missing, detached_head, invalid_path,
        land_not_configured, landing_running, no_local_base, not_committed, not_found,
        nothing_to_land, project_closed, usage, worktree_busy, worktree_in_plan,
        worktree_is_clone.
      parameters:
        - name: method
          in: query
          description: How to land this once; what the project says when not given.
          schema: { type: string, enum: [rebase, pr] }
        - $ref: "#/components/parameters/AskingAgent"
      responses:
        "202":
          description: It started, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeLandResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/rebase:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    post:
      operationId: rebaseWorktree
      summary: Rebase a worktree onto its base
      description: |
        The rebase step of landing on its own: no check, and the base does not move.
        It returns rebased, or up_to_date when the branch already sits on its base. A
        rebase that stops on a conflict is undone, leaving everything as it was:
        rebase_failed, with the files under details.conflicts. Files not committed
        refuse it, as nothing is stashed: not_committed, with them under
        details.files. A branch on origin is pushed again once rebased, over its
        commit there before the rebase only: push_failed when origin refuses, the
        rebase kept. A slot of a plan going on is refused: worktree_in_plan, with
        the plan under details.plan.

        A stacked plan's worktree, whose base is the branch of the plan below, asks
        gh whether that plan's PR has merged: merged, its merge commit in the local
        default branch, only the plan's own commits move onto the default branch,
        and its PR's base goes there too; merged but not pulled, it is refused,
        base_not_pulled, with the plan below under details.below and the default
        branch under details.base; not merged, its own commits move onto the plan
        below's branch as it is now. No gh is dependency_missing.

        Errors: agent_working, base_not_pulled, dependency_missing, detached_head,
        invalid_path, no_local_base, not_committed, not_found, project_closed,
        push_failed, rebase_failed, usage, worktree_busy, worktree_in_plan,
        worktree_is_clone.
      parameters:
        - $ref: "#/components/parameters/AskingAgent"
      responses:
        "200":
          description: It rebased, or was up to date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeRebased" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/diff:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
    get:
      operationId: getWorktreeDiff
      summary: What a worktree has committed since it left its base, as a PR shows it, or what it has not committed
      description: |
        Measured from the merge base, so that later commits on the base are not
        removals. What is not committed is not in it.

        With uncommitted, the patch is instead everything not committed, staged,
        not staged and untracked, with base, merge_base and ahead null.

        In a partial clone, what it takes is downloaded.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
        - name: uncommitted
          in: query
          description: Show what is not committed instead.
          schema: { type: boolean }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeDiff" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    get:
      operationId: listWorktreeFiles
      summary: The files of a worktree, tracked and untracked, without gitignored ones
      description: |
        A tracked file missing from disk is listed. What a nested repository holds
        is not. The paths are sorted and relative to the worktree. Directories that
        hold no file, which git does not list, come apart.

        Errors: invalid_path, not_found, usage.
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFiles" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWorktreeFile
      summary: Create an empty file or directory in a worktree
      description: |
        In a directory that is there. git is not run: the file is untracked.

        Errors: invalid_name, when the last name cannot be one; invalid_path, when
        the path leads out of the worktree or into .git; path_exists; not_found,
        for the worktree or the directory; usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeFileCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileChange" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: renameWorktreeFile
      summary: Rename a file or directory of a worktree, in its directory
      description: |
        git is not run: a tracked file renamed shows as deleted, and its new name
        as untracked.

        Errors: editor_running, when an editor has it, or a file in it, open;
        invalid_name; invalid_path; path_exists; not_found; usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeFileRename" }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileChange" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeWorktreeFile
      summary: Delete a file, or a directory with all it holds, from a worktree
      description: |
        For good: nothing goes to a trash, and git can bring back only what it
        tracks. A symbolic link is deleted, not what it leads to.

        Errors: editor_running; invalid_path; not_found; usage.
      parameters:
        - name: path
          in: query
          required: true
          description: Its path, relative to the worktree.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileChange" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files/content:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
    get:
      operationId: getWorktreeFileContent
      summary: What a file of a worktree holds now, on disk
      description: |
        A file that is binary or too large has no content, as a JSON string cannot
        carry the one and need not carry the other.

        Errors: invalid_path, when the path leads out of the worktree or is not a
        file; not_found; usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
        - name: path
          in: query
          required: true
          description: The file's path, relative to the worktree.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileContent" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files/diff:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
    get:
      operationId: getWorktreeFileDiff
      summary: The uncommitted changes of a file, with all of its lines
      description: |
        Staged, not staged or untracked, against HEAD. The patch is empty when the
        file has no uncommitted changes. In a partial clone, what it takes is
        downloaded.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
        - name: path
          in: query
          required: true
          description: The file's path, relative to the worktree.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileDiff" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files/verified:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
      - name: path
        in: query
        required: true
        description: The file's path, relative to the worktree.
        schema: { type: string, minLength: 1 }
    put:
      operationId: verifyWorktreeFile
      summary: Mark a file verified
      description: |
        A label a human gives a file, which nothing else depends on. It holds for
        as long as the file has the content marked: the next read of the worktree
        that finds it edited takes it away.

        Errors: invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeFileVerify" }
      responses:
        "200":
          description: The file, marked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileMark" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unverifyWorktreeFile
      summary: Take a file's verified mark away
      description: |
        Errors: invalid_path, not_found, usage.
      responses:
        "200":
          description: The file, not marked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileMark" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/comments:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    get:
      operationId: listWorktreeComments
      summary: List a worktree's comments in every state, by file and line
      description: |
        Errors: invalid_path, not_found, usage.
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeCommentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWorktreeComment
      summary: Save a comment on a line of a diff, not sent until its review is
      description: |
        Errors: invalid_argument, invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeCommentCreate" }
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeCommentEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/comments/{comment}:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - name: comment
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    patch:
      operationId: editWorktreeComment
      summary: Change the text of a comment not sent yet
      description: |
        Errors: invalid_argument, invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeCommentEdit" }
      responses:
        "200": { description: The comment was changed. }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorktreeComment
      summary: Delete a comment not sent yet
      description: |
        Errors: invalid_path, not_found, usage.
      responses:
        "200": { description: The comment was deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/reviews:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
    post:
      operationId: sendWorktreeReview
      summary: Send a worktree's comments not sent yet to an agent, as one message
      description: |
        The message is queued in the agent's inbox, as agent send does. With no
        agent to take it, the comments stay as they are.

        Errors: agent_not_running, agent_removed, invalid_argument, invalid_path, not_found, send_failed, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeReview" }
      responses:
        "200":
          description: The agent, with result queued, and how many comments went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeReviewResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/messages:
    get:
      operationId: listMessages
      summary: List a project's messages still waiting, oldest first
      description: |
        The messages of the project named by project, or of the project whose
        worktree holds dir; one of them must be given.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/messages/{message}:
    parameters:
      - name: message
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    delete:
      operationId: discardMessage
      summary: Discard a message still waiting
      description: |
        A review's comments go back to being drafts.

        Errors: not_found.
      responses:
        "200":
          description: The result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDiscarded" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/messages/{message}/resend:
    parameters:
      - name: message
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: resendMessage
      summary: Send a message still waiting to its terminal or agent, as it is now
      description: |
        Errors: agent_not_running, not_found, send_failed, terminal_not_running.
      responses:
        "200":
          description: The message, with result queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals:
    get:
      operationId: listTerminals
      summary: List terminals by project name, then name
      description: |
        The terminals of the project named by project, or of the project whose
        worktree holds dir; of every project when neither is given.

        Errors: invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
      responses:
        "200":
          description: The terminals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTerminal
      summary: Create a terminal and start its shell
      description: |
        Without project, the terminal belongs to the project whose worktree
        holds dir, the longest path winning, and its shell starts in dir.
        With project, it starts in dir when dir is in one of the project's
        worktrees, else in the project's clone path.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_name, invalid_path, name_taken, not_found,
        project_closed, start_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTerminal" }
      responses:
        "201":
          description: The terminal, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminal
      summary: A terminal, in any state
      description: "Errors: invalid_path, not_found."
      responses:
        "200":
          description: The terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTerminal
      summary: Delete a terminal
      description: |
        A terminal starting or running refuses it with terminal_running
        unless stop_running is true, which stops its shell first.

        Errors: invalid_path, not_found, terminal_running.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed terminal, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/start:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: startTerminal
      summary: Start a fresh shell for a terminal whose last one ended
      description: |
        For a terminal that exited, failed or was lost; never for one stopped
        by closing its project, which opening it relaunches.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_path, not_found, project_closed, start_failed, terminal_running.
      responses:
        "200":
          description: The terminal, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/send:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: sendTerminal
      summary: Queue a message for a running terminal's shell
      description: |
        The message goes in the inbox of the terminal's holder, which types it
        into the shell and presses Enter; it may not have reached the shell
        when this returns. One still queued when the shell ends is kept, held
        for a human: listMessages, resendMessage and discardMessage.

        A message that does not reach the holder returns send_failed with the
        terminal under details.terminal: the holder is too old and the terminal
        must be restarted, or the message does not fit in 1 MiB.

        Errors: invalid_path, not_found, send_failed, terminal_not_running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalMessage" }
      responses:
        "200":
          description: The terminal, with result queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/history:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminalHistory
      summary: Lines of a terminal's history, in any state
      description: |
        History is the lines that scrolled off the terminal's screen,
        numbered from 0 for the terminal's life, across relaunches of its
        shell, and kept up to terminal.history_lines. With from or count,
        the count lines from that number on, from 0 when not given; else
        the last tail lines. A from before the oldest line kept starts at
        that one.

        Errors: invalid_path, not_found; tail with from or count, or brief with
        any of them, is a usage error.
      parameters:
        - name: brief
          in: query
          description: |
            The conversation in brief, for an agent to read in a new session: from
            the latest summary, or the first request, the messages since, and each
            tool call as one line. Then from is the line of the file it starts at,
            and lines are the brief's own. Excludes from, count and tail.
          schema: { type: boolean }
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHistoryEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents as trees, by project name, then name
      description: |
        The agents of the project named by project, or of the project whose
        worktree holds dir, or of every project without either; every state
        is listed. The top level has the agents with no parent, the rest are
        in their parents' children.

        Errors: invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgent
      summary: Create an agent and start its AI coding agent
      description: |
        Without project, the agent belongs to the project whose worktree
        holds dir, and starts there. With it, in dir when dir is in the
        project, else in the project's clone path. With parent, it is a child
        of that agent: it belongs to the parent's project and starts in the
        parent's dir, whatever dir is.

        With worktree, it starts in that worktree of the project instead:
        "main" is the clone, any other name matches the base name of a
        worktree's path. A name that matches none creates the worktree in
        <project root>/.worktrees/<name>, on a new branch of that name from the
        HEAD of where it would otherwise start, and excludes .worktrees from
        git unless git already ignores it. A worktree created stays when the
        agent then fails, and the next request finds it.

        With model, its AI coding agent is told to use that model, and with
        permissions it may do that without asking; both are kept for every
        later start. A model with whitespace or a control character, or longer
        than 200 bytes, is invalid_argument; nothing else about it is checked.

        With aca, it runs that AI coding agent, which must be installed and
        enabled (listAcas); by default the first that is. One the daemon does not
        know is not_found with details.argument aca; one not installed or
        disabled, or none to run, is aca_unavailable, with details.aca,
        details.reason (not_installed or disabled) and details.program, null
        when none was asked for.

        An agent that does not start is left failed and returns start_failed
        with the agent under details.agent.

        Errors: aca_unavailable, agent_removed, branch_exists, invalid_argument, invalid_name,
        invalid_path, name_taken, not_found, path_exists, project_closed,
        start_failed, worktree_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgent" }
      responses:
        "201":
          description: The agent, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgent
      summary: An agent, in any state
      description: "Errors: invalid_path, not_found."
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAgent
      summary: Rename an agent
      description: |
        Its process, session and id stay as they are. A name is trimmed, and
        then has one or more of A-Z, a-z, 0-9 and "-". Names are unique within
        a project among agents and terminals, tombstones too, ignoring case;
        an agent may change the case of its own. A tombstone cannot be
        renamed.

        Errors: agent_removed, invalid_name, invalid_path, name_taken,
        not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgent" }
      responses:
        "200":
          description: The agent, with result renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      description: |
        An agent starting or running refuses it with agent_running unless
        stop_running is true. One with children stays as a tombstone, with
        state removed, until its last child is removed, and it is then
        deleted; removing a tombstone that has children refuses it with
        agent_removed. What the AI coding agent keeps of its session
        stays on disk.

        Errors: agent_removed, agent_running, invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed agent, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/start:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: startAgent
      summary: Start an agent whose AI coding agent ended, in the same session
      description: |
        For an agent that exited, failed or was lost. One that does not start
        is left failed and returns start_failed with the agent under
        details.agent. One whose AI coding agent is not installed is refused with
        aca_unavailable, as createAgent says; one disabled still starts, as
        disabling is for new agents.

        Errors: aca_unavailable, agent_busy, agent_removed, agent_running, invalid_path, not_found, project_closed,
        start_failed.
      responses:
        "200":
          description: The agent, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/restart:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: restartAgent
      summary: Start an agent again in a new session, which reads its history in brief
      description: |
        Stops its AI coding agent if it runs, and starts it in a new session under the
        same id, in the directory it last worked in if that is still there, else its
        own. The first message tells it to read getAgentTranscript's brief. Messages
        not yet delivered go on to the new session, after that one; those held stay
        held. A session the AI coding agent moved outside its terminal is stopped too, and
        named in stopped_sessions; at work, it counts as busy. One that is running and not idle with an empty input box refuses it with
        agent_busy, unless force. One that does not start is left failed, in the new
        session, and returns start_failed with the agent under details.agent. An AI
        coding agent that cannot begin a new session yet refuses it with
        aca_unsupported, and one not installed with aca_unavailable, before
        anything stops.

        Errors: aca_unavailable, aca_unsupported, agent_busy, agent_removed, invalid_path, not_found,
        project_closed, start_failed.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestartAgent" }
      responses:
        "200":
          description: The agent, with result restarted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/send:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: sendAgent
      summary: Queue a message for a running agent
      description: |
        The message goes in the inbox of the agent's holder, which delivers it
        once its screen allows: never while text is in its input box or a prompt
        is open, nor on a screen it cannot read. It may not have reached the
        agent when this returns. One still queued when the agent ends is kept:
        it goes on when the agent resumes the same session, or else is held
        for a human (listMessages).

        With instant it goes before the general messages and, when the agent is
        in a turn, its turn is interrupted first.

        A message that does not reach the holder returns send_failed with the
        agent under details.agent: the holder is too old and the agent must be
        restarted, or the message does not fit in 1 MiB.

        Errors: agent_not_running, agent_removed, invalid_path, not_found,
        send_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "200":
          description: The agent, with result queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/history:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgentHistory
      summary: Lines of an agent's history, in any state
      description: |
        As getTerminalHistory, of the lines that scrolled off the agent's
        screen.

        Errors: invalid_path, not_found; tail with from or count, or brief with
        any of them, is a usage error.
      parameters:
        - name: brief
          in: query
          description: |
            The conversation in brief, for an agent to read in a new session: from
            the latest summary, or the first request, the messages since, and each
            tool call as one line. Then from is the line of the file it starts at,
            and lines are the brief's own. Excludes from, count and tail.
          schema: { type: boolean }
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHistoryEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/agents/{agent}/transcript:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgentTranscript
      summary: Lines of an agent's conversation as text, in any state
      description: |
        wdx's backup of the conversation, across its compactions and sessions,
        kept until the agent is removed and brought up to date first. Unlike
        getAgentHistory, this is what the agent and the human said and did, not
        what the screen showed. An AI coding agent that keeps no backup yet, or
        has no brief, fails with aca_unsupported.

        Errors: aca_unsupported, invalid_path, not_found; tail with from or count, or brief with
        any of them, is a usage error.
      parameters:
        - name: brief
          in: query
          description: |
            The conversation in brief, for an agent to read in a new session: from
            the latest summary, or the first request, the messages since, and each
            tool call as one line. Then from is the line of the file it starts at,
            and lines are the brief's own. Excludes from, count and tail.
          schema: { type: boolean }
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTranscriptEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/acas:
    get:
      operationId: listAcas
      summary: The AI coding agents new agents can run
      description: |
        Those installed, as each one's program is found through the login shell
        terminals run, and enabled by the aca.<id>.enabled setting, in the order
        wdx offers them; the first, marked default, is what createAgent runs when
        given no aca. Empty when none can be used. What is installed is looked
        for at most every 30 seconds for this list; a request refused for an AI
        coding agent not installed always looks again first.
      responses:
        "200":
          description: The AI coding agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcaList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/acas/{aca}/models:
    parameters:
      - name: aca
        in: path
        required: true
        description: The AI coding agent's id, as claude_code.
        schema: { type: string, minLength: 1 }
    get:
      operationId: listAcaModels
      summary: The models an AI coding agent offers
      description: |
        As the AI coding agent says, in its order: each model's id is what
        createAgent's model takes. One marked default is what it runs when given
        none; with none marked, it runs what the user's own settings for it say.

        Errors: not_found, an AI coding agent this daemon does not know, with
        details.argument aca; aca_unavailable, one not installed or disabled,
        as createAgent says.
      responses:
        "200":
          description: Its models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcaModelList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/usage:
    get:
      operationId: listUsage
      summary: How much of each AI coding agent's account's limits is used
      description: |
        As each AI coding agent last told through one of its agents (the wdx doc
        USAGE): a row per ACA, window and bucket of models, the latest observation
        only, with the window's key and the bucket's name as the ACA gives them.
        Usage is the account's, not an agent's: every agent of an ACA on this
        machine draws on the same one. A window used 100% or more is limited, and
        a bucket is available while none of its windows is. Empty until an ACA has
        told something; one on a plan without limits never does.
      responses:
        "200":
          description: The usage rows, by ACA, window and bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/editors:
    post:
      operationId: openEditor
      summary: Start the editor the editor setting names on a file of a worktree
      description: |
        The editor runs in a terminal of its own in the worktree, through the login
        shell, until it exits, when it is gone: it is never started again. Only one
        runs on a file: asking again returns it, with result opened. It shows in the
        project's editors, and closing the project or removing the worktree stops it.
        The editor is looked for through the login shell first.

        Errors: dependency_missing, with the editor under details.dependency;
        invalid_path, when the path leads out of the worktree or is not a file;
        not_found; project_closed; start_failed; usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenEditor" }
      responses:
        "201":
          description: The editor started, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorResult" }
        "200":
          description: The editor already running on the file, with result opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs:
    get:
      operationId: listDocs
      summary: List a project's docs by name
      description: |
        The docs of the project named by project, or of the project whose
        worktree holds dir; one of them is required. With labels, only the
        docs that have every one of them; with status, only those in it.
        Content is never listed.

        Errors: invalid_argument, invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
        - name: labels
          in: query
          description: Labels a doc must all have; repeated, as in labels=a&labels=b.
          schema: { type: array, items: { type: string, minLength: 1 } }
        - name: status
          in: query
          description: The status a doc must be in.
          schema: { $ref: "#/components/schemas/DocStatus" }
      responses:
        "200":
          description: The docs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDoc
      summary: Create a doc at revision 1
      description: |
        In the project named by project, or the one whose worktree holds dir;
        one of them is required. Names are A-Z, a-z, 0-9, "_" and "-", at
        most 100, unique in the project ignoring case. A format is A-Z, a-z
        and 0-9, at most 10, or empty. Labels are a-z, 0-9, "_" and "-", at
        most 50 each and 20 in all. Content is UTF-8 with no NUL, at most
        2 MiB. A folder is cleaned (whitespace dropped, lowercased, a leading
        "/" added, every run of "/" made one and a trailing one dropped), then
        must be a-z, 0-9, "_", "-" and "/", or it is invalid_argument; it is
        only a label tide shows the docs under. Docs work in a closed project
        too.

        Errors: invalid_argument, invalid_name, invalid_path, name_taken (with
        the doc under details.doc), not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDoc" }
      responses:
        "201":
          description: The doc, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs/sync-to-git:
    post:
      operationId: syncDocsToGit
      summary: Write a project's docs, read-only, into a directory of its repository
      description: |
        In the project named by project, or the one whose worktree holds dir;
        one of them is required. path is relative to the project's main
        checkout, whatever dir is; an absolute one, one leading out of the
        checkout, through ".." or a symlink, or one into .git, is
        invalid_path. The directory is created when missing.

        Every doc's latest revision is written as <name>.<format>, read-only;
        a file of that name that wdx did not write is left as it is, and the
        doc skipped. Files wdx wrote there of docs that are gone are removed,
        and only those: .wdx-docs lists what it wrote. Nothing is staged or
        committed.

        Errors: checkout_missing, invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncDocs" }
      responses:
        "200":
          description: What was written, with result synced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocSyncResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs/{doc}:
    parameters:
      - $ref: "#/components/parameters/DocRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getDoc
      summary: A doc with one revision's content, the latest by default
      description: "Errors: invalid_path, not_found (the doc, or a revision it does not have), usage."
      parameters:
        - name: revision
          in: query
          description: The revision whose content to return.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The doc and the revision's content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocContent" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDoc
      summary: Change a doc's folder, status or labels, or rename it
      description: |
        Never makes a revision and needs no base. name excludes folder,
        status, add_labels and remove_labels; asking for nothing is a usage
        error. A
        label in both add_labels and remove_labels is invalid_argument;
        removing a label the doc does not have is not an error. Result
        updated, or unchanged when nothing differs.

        Errors: invalid_argument, invalid_name, invalid_path, name_taken (with
        the doc under details.doc), not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDoc" }
      responses:
        "200":
          description: The doc, with result updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDoc
      summary: Delete a doc, its revisions and its copies on disk
      description: "Errors: invalid_path, not_found, usage."
      responses:
        "200":
          description: The removed doc, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs/{doc}/content:
    parameters:
      - $ref: "#/components/parameters/DocRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    put:
      operationId: updateDocContent
      summary: Write a doc's content as a new revision, if base is still its latest
      description: |
        In one step: when base is the doc's latest revision, content becomes
        revision base + 1 and the status wip, result updated with
        previous_status; content equal to the latest makes no revision and
        keeps the status, result unchanged. When base is not the latest,
        doc_changed, with the doc under details.doc: read it again, apply the
        change and write it with the new base.

        Errors: doc_changed, invalid_argument, invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocContentChange" }
      responses:
        "200":
          description: The doc, with result updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs/{doc}/revisions:
    parameters:
      - $ref: "#/components/parameters/DocRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: listDocRevisions
      summary: A doc's revisions, latest first, without content
      description: "Errors: invalid_path, not_found, usage."
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocRevisionList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans:
    get:
      operationId: listPlans
      summary: List a project's plans by folder, then name
      description: |
        The plans of the project named by project, or of the project whose
        worktree holds dir; one of them is required. Content is never listed.
        The archived are left out unless archived is true.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
        - name: archived
          in: query
          description: List the archived plans too.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlan
      summary: Create a plan at revision 1, checked and reduced
      description: |
        In the project named by project, or the one whose worktree holds dir;
        one of them is required. Names are A-Z, a-z, 0-9 and "-", at most 95,
        unique among the project's plans ignoring case; a doc may have the
        same name. content is the plan's YAML (wdx help plans): every
        problem in it is reported at once, as invalid_plan with
        details.problems. Every after another path already covers is
        dropped, rewriting the YAML; dropped lists them. A plan of plans
        makes each plan it lists its child, and gives it its folder; moved
        names those whose folder changed. A folder is cleaned and checked as
        createDoc's.

        Errors: invalid_argument, invalid_name, invalid_path, invalid_plan,
        name_taken (with the plan under details.plan), not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlan" }
      responses:
        "201":
          description: The plan, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getPlan
      summary: A plan with one revision's content and what it defines, the latest by default
      description: "Errors: invalid_path, not_found (the plan, or a revision it does not have), usage."
      parameters:
        - name: revision
          in: query
          description: The revision whose content to return.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The plan, the revision's content and its definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanContent" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePlan
      summary: Rename a draft plan, move it to a folder, or change how many tasks a run runs at once
      description: |
        name, or folder, parallel or both; asking for nothing is a usage
        error. Result updated, or unchanged when the name is the plan's, case
        and all, the folder is already its, and the run's parallel is already
        that.

        folder: in any state, cleaned and checked as createDoc's. A plan of
        plans and the plans it lists move together, whichever of them is
        named; moved names the others whose folder changed. With parallel,
        a plan not running changes neither.

        name: a plan a plan of plans lists cannot be renamed, plan_in_use,
        with the parent under details.parent; nor can a plan that has run,
        plan_started, with the plan under details.plan.

        parallel: only for a run running or paused, plan_not_running
        otherwise, with the plan under details.plan. The runner starts more
        at once when it rises; tasks at work go on when it falls.

        Errors: invalid_argument, invalid_name, invalid_path, name_taken
        (with the plan under details.plan), not_found, plan_in_use,
        plan_not_running, plan_started, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlan" }
      responses:
        "200":
          description: The plan, with result updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlan
      summary: Delete a plan, its revisions and its copy on disk
      description: |
        A plan a plan of plans lists cannot be removed: plan_in_use, with the
        parent under details.parent. Removing a plan of plans leaves the
        plans it listed with no parent. A plan that has run cannot be
        removed: plan_started, with the plan under details.plan.

        Errors: invalid_path, not_found, plan_in_use, plan_started, usage.
      responses:
        "200":
          description: The removed plan, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/content:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    put:
      operationId: updatePlanContent
      summary: Write a plan's content as a new revision, checked and reduced, if base is still its latest
      description: |
        Checked and reduced as in createPlan. When base is the plan's latest
        revision, the content becomes revision base + 1, result updated;
        content that reduces to the latest makes no revision, result
        unchanged. When base is not the latest, plan_changed, with the plan
        under details.plan: read it again, apply the change and write it
        with the new base. A plan of plans' children follow its new
        revision and take its folder, as moved says. A plan that has run
        cannot be changed: plan_started, with the plan under details.plan.

        Errors: invalid_argument, invalid_path, invalid_plan, not_found,
        plan_changed, plan_started, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocContentChange" }
      responses:
        "200":
          description: The plan, with result updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/revisions:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: listPlanRevisions
      summary: A plan's revisions, latest first, without content
      description: "Errors: invalid_path, not_found, usage."
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocRevisionList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/run:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: runPlan
      summary: Run a draft plan of tasks
      description: |
        Makes the branch plan/<name> at the tip of the project's default
        branch and writes the run, result started; the daemon then starts an
        agent for each task that can go, in worktrees of the plan's, and
        lands each finished task on the branch, until every task is done. A
        plan runs once.

        Errors: branch_exists (plan/<name>, or a branch in its way, is
        there), invalid_argument (a plan of plans, which does not run yet),
        invalid_path, not_found, plan_in_use (a plan of plans lists it,
        with the parent under details.parent), plan_started (it has run,
        with the plan under details.plan), project_closed, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunPlan" }
      responses:
        "200":
          description: The plan, running, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/pause:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: pausePlan
      summary: Pause a running plan, so that nothing new starts while tasks at work go on and land
      description: |
        Result paused, or unchanged when it was paused. A plan paused while its project is closed stays paused when the project opens.

        Errors: invalid_path, not_found, plan_not_running (a draft, done or cancelled, with the plan under details.plan), usage.
      responses:
        "200":
          description: The plan, with result paused or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/copies:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: copyPlan
      summary: Create a draft from a plan's latest revision, in any state
      description: |
        Checked as createPlan checks a new plan, in the same project: a name
        taken is name_taken; a plan of plans' copy is invalid_plan, as the
        plans it lists already have a parent. It goes in folder, or the
        plan's. It has none of the plan's history, run, branch or worktrees.

        Errors: invalid_argument, invalid_name, invalid_path, invalid_plan,
        name_taken (with the plan under details.plan), not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyPlan" }
      responses:
        "201":
          description: The copy, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/archive:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: archivePlan
      summary: Archive a done or cancelled plan, leaving it out of listPlans
      description: |
        Result archived, or unchanged when it was archived. Nothing else of
        it changes: its branch, worktree, summaries and history stay.

        Errors: invalid_path, not_found, plan_not_finished (a draft, running
        or paused, or cancelled with its agents still stopping, with the plan
        under details.plan), usage.
      responses:
        "200":
          description: The plan, with result archived or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/unarchive:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: unarchivePlan
      summary: Show an archived plan in listPlans again
      description: |
        Result unarchived, or unchanged when it was not archived.

        Errors: invalid_path, not_found, plan_not_finished (as archivePlan),
        usage.
      responses:
        "200":
          description: The plan, with result unarchived or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/resume:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: resumePlan
      summary: Resume a paused plan
      description: |
        Result resumed, or unchanged when it was running. Refused while its project is closed, as nothing could run: project_closed.

        Errors: invalid_path, not_found, plan_not_running (a draft, done or cancelled, with the plan under details.plan), usage, project_closed.
      responses:
        "200":
          description: The plan, with result resumed or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/cancel:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: cancelPlan
      summary: Cancel a running or paused plan, which cannot run again
      description: |
        Result cancelled: the daemon stops its agents and any landing going, keeps each worktree of the plan holding work as an ordinary worktree, removes the others, and keeps its branch.

        Errors: invalid_path, not_found, plan_not_running (a draft, done or cancelled, with the plan under details.plan), usage.
      responses:
        "200":
          description: The plan, with result cancelled or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/tasks/{task}/retry:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - name: task
        in: path
        required: true
        description: The task's id in the plan.
        schema: { type: string, minLength: 1 }
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: retryPlanTask
      summary: Run a failed or land_failed task again
      description: |
        Result retried: the task is pending again, keeping its worktree and its commits, and starts when there is room under its run's parallel. Its agent is resumed, told what went wrong, unless fresh, or its worktree is gone, when a new agent starts, named <plan>-<task>-<n>, told a previous attempt left its commits.

        Errors: invalid_path, not_found, plan_not_running, task_state (it is not failed or land_failed, with the task's id and state under details.task), usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryPlanTask" }
      responses:
        "200":
          description: The task, with result retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTaskResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/tasks/{task}/land:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - name: task
        in: path
        required: true
        description: The task's id in the plan.
        schema: { type: string, minLength: 1 }
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: landPlanTask
      summary: Land a land_failed task again, once the person dealt with what stopped it
      description: |
        Result landing: the daemon rebases it onto the plan's branch, runs the check, and moves the branch.

        Errors: agent_working (an agent is at work in its worktree), invalid_path, not_committed, not_found, plan_not_running, task_state (it is not land_failed), usage, wrong_branch.
      responses:
        "200":
          description: The task, with result landing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTaskResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/tasks/{task}/skip:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - name: task
        in: path
        required: true
        description: The task's id in the plan.
        schema: { type: string, minLength: 1 }
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: skipPlanTask
      summary: Skip a pending, failed or land_failed task, so that what waits for it goes on without its work
      description: |
        Result skipped. Its worktree, if it holds work, is kept as an ordinary worktree on its branch; if not, it is freed for another task.

        Errors: invalid_path, not_found, plan_not_running, task_state (it is not pending, failed or land_failed), usage.
      responses:
        "200":
          description: The task, with result skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTaskResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/plans/{plan}/tasks/{task}/done:
    parameters:
      - $ref: "#/components/parameters/PlanRef"
      - name: task
        in: path
        required: true
        description: The task's id in the plan.
        schema: { type: string, minLength: 1 }
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: finishPlanTask
      summary: Say a running task is done, or a failed one the person finished, with a summary, so that it lands on the plan's branch
      description: |
        Result landing: the daemon stops the task's agent and lands its
        worktree on the plan's branch. The summary is told to the tasks
        that wait for it, and is never logged.

        Errors: agent_working (a failed task's worktree has an agent at
        work), invalid_path, not_committed (its worktree has changes or
        files not committed), not_found (the plan, or a task its run does
        not have), plan_not_running, task_state (it is not running or
        failed, with the task's id and state under details.task), usage,
        wrong_branch (its worktree is not on the task's branch, which
        details.branch names).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPlanTask" }
      responses:
        "200":
          description: The task, landing, with result landing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTaskResult" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    WorktreeRef:
      name: worktree
      in: path
      required: true
      description: The worktree's name, main for the clone.
      schema: { type: string, minLength: 1 }
    WorktreeProject:
      name: project
      in: query
      description: The project's name, or "id:" and its id; excludes dir.
      schema: { type: string, minLength: 1 }
    AskingAgent:
      name: agent_id
      in: query
      description: |
        The agent asking, which is not counted as working in the worktree: an agent
        running the command is always mid-turn. One that is no agent of the project
        is not_found.
      schema: { type: string, minLength: 1 }
    WorktreeDir:
      name: dir
      in: query
      description: An absolute path in one of the project's worktrees; excludes project.
      schema: { type: string, minLength: 1 }
    ProjectRef:
      name: project
      in: path
      required: true
      description: The project's name (case-insensitive), or "id:" and its id, as in id:proj-1a2b3c4d.
      schema: { type: string, minLength: 1 }
    TerminalRef:
      name: terminal
      in: path
      required: true
      description: |
        "id:" and the terminal's id, as in id:term-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    TerminalProject:
      name: project
      in: query
      description: The project's name, or "id:" and its id; excludes dir.
      schema: { type: string, minLength: 1 }
    TerminalDir:
      name: dir
      in: query
      description: An absolute path in one of the project's worktrees; excludes project.
      schema: { type: string, minLength: 1 }
    AgentRef:
      name: agent
      in: path
      required: true
      description: |
        "id:" and the agent's id, as in id:agent-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    DocRef:
      name: doc
      in: path
      required: true
      description: |
        "id:" and the doc's id, as in id:doc-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    PlanRef:
      name: plan
      in: path
      required: true
      description: |
        "id:" and the plan's id, as in id:doc-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    StopRunning:
      name: stop_running
      in: query
      description: Stop the terminals and agents that are starting or running instead of refusing.
      schema: { type: boolean, default: false }

  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Version:
      type: object
      required: [name, version, commit]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }

    Daemon:
      type: object
      required: [name, version, commit, pid, home, socket, started_at]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }
        pid: { type: integer }
        home: { type: string }
        socket: { type: string }
        started_at: { type: string, format: date-time }

    ProjectState:
      type: string
      enum: [open, closed]

    Setting:
      type: object
      required: [key, value, default, description, from, choices, editable]
      properties:
        key: { type: string, description: "Its dotted key, such as log.level." }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        from: { type: string, description: "Where the value comes from: the default, the file and line, or the variable." }
        choices:
          type: array
          nullable: true
          description: The values to choose among, when it takes a fixed set; null when it takes any text or number.
          items: { type: string }
        editable: { type: boolean, description: "False when it is not read from the config file, so it cannot be set here." }

    SettingList:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }

    UpdateSetting:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string, description: "Its new value; empty for the settings that take that." }

    SettingResult:
      type: object
      required: [result, setting]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        setting: { $ref: "#/components/schemas/Setting" }

    ReloadResult:
      type: object
      required: [result]
      properties:
        result: { $ref: "#/components/schemas/Result" }

    RestartAgent:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          description: Restart it even in the middle of its work.

    Result:
      type: string
      description: The most significant thing that happened.
      enum: [created, registered, cloned, opened, closed, removed, started, detached, exited, reloaded, queued, renamed, updated, unchanged, landed, restarted, pr_opened, synced, landing, paused, resumed, cancelled, retried, skipped, archived, unarchived, rebased, up_to_date]

    Worktree:
      type: object
      required: [id, path, created_at]
      properties:
        id: { type: string }
        path: { type: string }
        present:
          type: boolean
          description: Whether the checkout is on disk; set by getProject only.
        created_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, origin, state, worktrees, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        orphaned:
          type: boolean
          description: Whether none of the checkouts is on disk; set by getProject only.
        worktrees:
          type: array
          items: { $ref: "#/components/schemas/Worktree" }
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }
          description: The project's terminals by name, in every state; set by getProject only.
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
          description: The project's agents with no parent by name, in every state, with their children; set by getProject only.
        editors:
          type: array
          items: { $ref: "#/components/schemas/Editor" }
          description: The editors running in the project; set by getProject only.
        docs:
          type: array
          items: { $ref: "#/components/schemas/Doc" }
          description: The project's docs by name, without content; set by getProject only.
        plans:
          type: array
          items: { $ref: "#/components/schemas/Plan" }
          description: The project's plans by name, without content; set by getProject only.
        worktree_statuses:
          type: array
          items: { $ref: "#/components/schemas/WorktreeStatus" }
          description: Every checkout git lists, as last read; set only by streamProject with worktrees, once read.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorktreeStatus:
      type: object
      required: [name, path, branch, head, missing, unread, base, ahead, behind, added, removed, files, committed_files, comments]
      properties:
        name: { type: string, description: "main for the clone, else the last part of its path, with a number if that is taken." }
        path: { type: string }
        branch: { type: string, nullable: true, description: "Null when HEAD is detached." }
        head: { type: string, nullable: true, description: "Null with no commit yet." }
        missing: { type: boolean, description: "Its directory is gone." }
        unread: { type: boolean, description: "True while a project's stream lists it before its files and commits were first read: they are empty until then. Always false elsewhere." }
        pull_request:
          nullable: true
          description: What gh last said of its PR; null when none is known. It is asked only when the user looks.
          allOf: [{ $ref: "#/components/schemas/WorktreePullRequest" }]
        landing:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WorktreeLanding" }]
        base: { type: string, nullable: true, description: "What its commits are measured against: the default branch, or the same on origin when it is on that branch, or for a stacked plan's branch and its tasks' the branch of the plan below; null when there is neither." }
        ahead: { type: integer, nullable: true, description: "Commits it has that base has not; null when not known." }
        behind: { type: integer, nullable: true, description: "Commits base has that it has not, as when base has moved on; null when not known." }
        added: { type: integer, nullable: true, description: "Lines those commits add; null when not known, as in a partial clone." }
        removed: { type: integer, nullable: true, description: "Lines those commits remove; null when not known." }
        files:
          type: array
          items: { $ref: "#/components/schemas/WorktreeFile" }
          description: The files with uncommitted changes, by path.
        committed_files:
          type: array
          items: { $ref: "#/components/schemas/WorktreeCommittedFile" }
          description: The files its commits changed since it left base, by path.
        comments:
          type: array
          items: { $ref: "#/components/schemas/WorktreeComment" }
          description: Its comments not sent yet, by file and line.

    WorktreeComment:
      type: object
      required: [id, file, line, side, view, quote, body, state, changed, created_at]
      properties:
        id: { type: string }
        file: { type: string, description: "Relative to the worktree." }
        line: { type: integer }
        side:
          type: string
          enum: [new, old]
          description: The file now, or a line removed from it.
        view:
          type: string
          enum: [uncommitted, committed]
          description: Which diff it was written on.
        quote: { type: string, description: "The line as it was seen." }
        body: { type: string }
        state:
          type: string
          enum: [draft, sent, delivered]
          description: sent is with the agent's holder; delivered is typed in.
        changed: { type: boolean, description: "The file differs from what was seen. Set on drafts." }
        created_at: { type: string, format: date-time }

    WorktreeCommentCreate:
      type: object
      required: [file, line, side, view, body]
      properties:
        file: { type: string, minLength: 1 }
        line: { type: integer, minimum: 1 }
        side:
          type: string
          enum: [new, old]
        view:
          type: string
          enum: [uncommitted, committed]
        quote: { type: string }
        body: { type: string }
        content_id: { type: string, description: "The file's blob id as the patch looked at says it; as it is now when not given." }

    WorktreeCommentEdit:
      type: object
      required: [body]
      properties:
        body: { type: string }

    WorktreeCommentEnvelope:
      type: object
      required: [comment]
      properties:
        comment: { $ref: "#/components/schemas/WorktreeComment" }

    WorktreeCommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/WorktreeComment" }

    WorktreeReview:
      type: object
      required: [agent]
      properties:
        agent: { type: string, minLength: 1, description: "The agent to send it to: its name, or id: and its id." }
        note: { type: string, description: "Said before the comments." }

    WorktreeReviewResult:
      type: object
      required: [result, agent, comments]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        agent: { $ref: "#/components/schemas/Agent" }
        comments: { type: integer, description: "How many comments went." }

    Message:
      type: object
      required: [id, terminal_id, name, text, instant, state, attempts, created_at]
      properties:
        id: { type: string }
        terminal_id: { type: string }
        name: { type: string, description: "The terminal's or agent's." }
        text: { type: string }
        instant: { type: boolean }
        state:
          type: string
          enum: [pending, delivered, held, unconfirmed]
          description: "pending is on its way; held waits for a human, as its holder died and what it was meant for is gone."
        attempts: { type: integer, description: "How many times it was handed to a holder. Above 1 it may have come twice." }
        created_at: { type: string, format: date-time }

    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }

    MessageResult:
      type: object
      required: [result, message]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        message: { $ref: "#/components/schemas/Message" }

    MessageDiscarded:
      type: object
      required: [result]
      properties:
        result: { $ref: "#/components/schemas/Result" }

    WorktreeCommittedFile:
      type: object
      required: [path, status, verified]
      properties:
        path: { type: string, description: "Relative to the worktree." }
        status:
          type: string
          enum: [M, A, D]
          description: M changed, A added, D deleted.
        verified: { type: boolean, description: "A human marked it verified, and it has not changed since." }

    ProjectLanding:
      type: object
      required: [configured, method, check, push]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        configured: { type: boolean, description: "False until it is set: landing needs it." }
        method: { type: string, enum: [rebase, pr], description: "How it lands: moving the base, or opening a PR." }
        check: { type: string, nullable: true, description: "The command run before landing; null for none." }
        push: { type: boolean, description: "Whether a base that moved is pushed to origin." }

    ProjectLandingUpdate:
      type: object
      required: [push]
      properties:
        method: { type: string, enum: [rebase, pr], description: "What is saved already when not given, rebase at first." }
        check: { type: string, nullable: true, description: "The command run before landing; null or empty for none." }
        push: { type: boolean }

    WorktreeLanding:
      type: object
      required: [id, state, code, detail, conflicts, terminal, base, commit, head, pushed, push_error, pull_request]
      description: A landing of the worktree, the one running or the last. A restarted daemon forgets it.
      properties:
        id: { type: string }
        state: { type: string, enum: [rebasing, checking, moving, pushing, opening, landed, opened, failed], description: "It ends in landed, opened by a landing by PR, or failed." }
        code: { type: string, nullable: true, description: "When failed: base_moved, check_failed, fast_forward_failed, pr_failed, push_failed or rebase_failed." }
        detail: { type: string, nullable: true, description: What went wrong. }
        conflicts:
          type: array
          description: The files a rebase stopped on.
          items: { type: string }
        terminal: { type: string, nullable: true, description: "The terminal running the check; one that failed stays to read." }
        base: { type: string }
        commit: { type: string, nullable: true, description: "The commit that lands, once it is known." }
        head: { type: string, nullable: true, description: "The commit the worktree was on when it failed." }
        pushed: { type: boolean }
        push_error: { type: string, nullable: true, description: "A push that failed: it landed all the same." }
        pull_request:
          nullable: true
          description: The PR a landing by PR opened or found open.
          allOf: [{ $ref: "#/components/schemas/WorktreePullRequest" }]

    WorktreePullRequest:
      type: object
      required: [number, url, state, head]
      description: What gh last said of a PR.
      properties:
        number: { type: integer }
        url: { type: string }
        state: { type: string, enum: [open, merged, closed] }
        head: { type: string, description: "The commit it is at." }

    WorktreeLandResult:
      type: object
      required: [result, worktree, project_id, landing]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        worktree: { type: string }
        project_id: { type: string }
        landing: { $ref: "#/components/schemas/WorktreeLanding" }

    WorktreeRebased:
      type: object
      required: [result, worktree, base, head_before, head_after, pushed]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        worktree: { type: string }
        base: { type: string, description: The branch it was rebased onto. }
        head_before: { type: string, description: The commit it was on. }
        head_after: { type: string, description: "The commit it is on: head_before when up_to_date." }
        pushed: { type: boolean, description: Whether its branch was pushed to origin again. }

    WorktreeRemoved:
      type: object
      required: [result, worktree, path, branch_deleted, branch_kept, notified, stopped_editors]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        worktree: { type: string }
        path: { type: string }
        branch_deleted: { type: string, nullable: true, description: The branch that went with it. }
        branch_kept: { type: string, nullable: true, description: "Its branch, when git would not delete it or it is the default branch." }
        notified:
          type: array
          description: The names of the agents told where to go on.
          items: { type: string }
        stopped_editors:
          type: array
          description: The editors that ran in it, stopped.
          items: { $ref: "#/components/schemas/Editor" }

    WorktreeFileMark:
      type: object
      required: [worktree, path, verified]
      properties:
        worktree: { type: string }
        path: { type: string }
        verified: { type: boolean }

    WorktreeFileVerify:
      type: object
      properties:
        content_id:
          type: string
          description: The file's blob id as the patch looked at says it; the content it has now when not given.

    WorktreeFile:
      type: object
      required: [path, status, size, modified_at, verified]
      properties:
        path: { type: string, description: "Relative to the worktree." }
        status:
          type: string
          enum: [M, A, D, "?", U]
          description: M changed, A added, D deleted, ? untracked, U in conflict.
        size: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time, nullable: true, description: "Null for a deleted file." }
        verified: { type: boolean, description: "A human marked it verified, and it has not changed since." }

    WorktreeList:
      type: object
      required: [worktrees]
      properties:
        worktrees:
          type: array
          items: { $ref: "#/components/schemas/WorktreeStatus" }

    WorktreeDiff:
      type: object
      required: [worktree, base, merge_base, ahead, patch, binary, truncated]
      properties:
        worktree: { type: string }
        base: { type: string, nullable: true, description: "As in WorktreeStatus." }
        merge_base: { type: string, nullable: true, description: "Null when it shares no history with base, or has none." }
        ahead: { type: integer, nullable: true }
        patch: { type: string, description: "The unified diff; empty when nothing is ahead." }
        binary: { type: boolean, description: "A file in it is binary, and only said to differ." }
        truncated: { type: boolean, description: "Too long: patch is its beginning." }

    WorktreeFileDiff:
      type: object
      required: [worktree, path, patch, binary, truncated]
      properties:
        worktree: { type: string }
        path: { type: string }
        patch: { type: string, description: "The unified diff with every line of the file; empty when nothing is uncommitted." }
        binary: { type: boolean, description: "The file is binary, and only said to differ." }
        truncated: { type: boolean, description: "Too long: patch is its beginning." }

    WorktreeFiles:
      type: object
      required: [worktree, paths, empty_dirs, truncated]
      properties:
        worktree: { type: string }
        paths:
          type: array
          items: { type: string }
        empty_dirs:
          type: array
          items: { type: string }
          description: The directories, not gitignored, that hold no file, without a slash at their end.
        truncated: { type: boolean, description: "Always false: every file is listed, however many. Kept so that nothing reading it breaks." }

    WorktreeFileCreate:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, description: "Where, relative to the worktree." }
        directory: { type: boolean, default: false, description: "A directory rather than a file." }

    WorktreeFileRename:
      type: object
      required: [path, name]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, description: "Relative to the worktree." }
        name: { type: string, minLength: 1, description: "Its new name, in the same directory." }

    WorktreeFileChange:
      type: object
      required: [result, worktree, path]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        worktree: { type: string }
        path: { type: string, description: "Where it is now; where it was, once deleted." }
        from: { type: string, description: "Where it was, when renamed." }

    WorktreeFileContent:
      type: object
      required: [worktree, path, content, binary, too_large, size]
      properties:
        worktree: { type: string }
        path: { type: string }
        content: { type: string, nullable: true, description: "The text; null when binary or too large." }
        binary: { type: boolean, description: "It has a NUL or is not UTF-8." }
        too_large: { type: boolean, description: "Over 2 MiB." }
        size: { type: integer, format: int64, description: "Its size in bytes." }

    ProjectSummary:
      type: object
      required: [id, name, origin, state, worktree_count, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        worktree_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }

    ProjectEnvelope:
      type: object
      required: [project, tabs, tabs_revision]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        tabs:
          type: array
          description: The tabs tide has open in the project, in their order.
          items: { $ref: "#/components/schemas/Tab" }
        tabs_revision: { $ref: "#/components/schemas/TabsRevision" }

    Tab:
      type: object
      description: |
        A tab tide has open. Each kind has the fields it names and null for the
        others: agent and info an agent_id, doc a doc_id, plan the plan's id
        in doc_id, file and diff a worktree and a path, pr a worktree;
        settings and stats none.
      required: [kind, agent_id, doc_id, worktree, path]
      properties:
        kind: { $ref: "#/components/schemas/TabKind" }
        agent_id: { type: string, nullable: true }
        doc_id: { type: string, nullable: true }
        worktree:
          type: string
          nullable: true
          description: The worktree's name, main for the clone.
        path:
          type: string
          nullable: true
          description: The file, relative to the worktree.
        missing:
          type: boolean
          description: |
            In responses: what the tab shows was removed outside wdx, and is
            not there now (docs/TIDE_STATE.md). A file tab's file, or the
            worktree of a file, diff or pr tab, as git lists it. Ignored in a
            request.

    TabKind:
      type: string
      description: |
        What a tab shows: an agent's terminal, what wdx knows of it, the
        settings, a worktree's file, that file's diff, what a worktree changed,
        a doc, a plan, the stats of the AI coding agents.
      enum: [agent, info, settings, file, diff, pr, doc, plan, stats]

    View:
      type: object
      required: [view]
      properties:
        view:
          type: object
          description: What tide shows, as tide wrote it; only tide reads it.
          additionalProperties: true

    ViewResult:
      type: object
      required: [result, view]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        view:
          type: object
          additionalProperties: true

    TabsUpdate:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items: { $ref: "#/components/schemas/Tab" }

    TabsResult:
      type: object
      required: [result, tabs, tabs_revision]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        tabs:
          type: array
          items: { $ref: "#/components/schemas/Tab" }
        tabs_revision: { $ref: "#/components/schemas/TabsRevision" }

    TabsRevision:
      type: integer
      format: int64
      description: |
        How many changes the project's tabs had, 0 before any. A later read
        never has fewer, so tide tells an event sent before its own change
        from one sent after.

    ProjectRemoved:
      type: object
      description: The data of streamProject's removed event.
      required: [project_id]
      properties:
        project_id: { type: string }

    ProjectResult:
      type: object
      required: [result, project]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        project: { $ref: "#/components/schemas/Project" }
        dropped:
          type: array
          description: The checkouts dropped because they are no longer on disk.
          items: { $ref: "#/components/schemas/Worktree" }
        conflict:
          $ref: "#/components/schemas/Problem"
        started:
          type: array
          description: The terminals opening the project relaunched, in the state each reached.
          items: { $ref: "#/components/schemas/Terminal" }
        stopped_sessions:
          type: array
          description: The sessions of its agents that closing or removing the project stopped outside their terminals, where their AI coding agent had moved them; left out when there were none.
          items: { type: string }
        stopped:
          type: array
          description: The terminals closing or removing the project stopped.
          items: { $ref: "#/components/schemas/Terminal" }
        started_agents:
          type: array
          description: The agents opening the project relaunched, in the state each reached.
          items: { $ref: "#/components/schemas/Agent" }
        stopped_agents:
          type: array
          description: The agents closing or removing the project stopped.
          items: { $ref: "#/components/schemas/Agent" }
        stopped_editors:
          type: array
          description: The editors closing or removing the project stopped, which do not start again.
          items: { $ref: "#/components/schemas/Editor" }

    CreateProject:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Source" }
        name:
          type: string
          description: Required for source new; otherwise the repository directory or URL name by default.
        on_conflict:
          type: string
          enum: [open, cancel]
        on_missing_checkout:
          type: string
          enum: [reclone, remove]

    Source:
      oneOf:
        - $ref: "#/components/schemas/NewSource"
        - $ref: "#/components/schemas/LocalSource"
        - $ref: "#/components/schemas/GitSource"
      discriminator:
        propertyName: type
        mapping:
          new: "#/components/schemas/NewSource"
          local: "#/components/schemas/LocalSource"
          git: "#/components/schemas/GitSource"

    NewSource:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [new] }
        path:
          type: string
          description: Absolute directory to create the repository in; <home>/projects by default.

    LocalSource:
      type: object
      required: [type, path]
      additionalProperties: false
      properties:
        type: { type: string, enum: [local] }
        path:
          type: string
          description: Absolute path in a git repository.

    GitSource:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: { type: string, enum: [git] }
        url: { type: string, description: Clone URL. }

    UpdateProject:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { $ref: "#/components/schemas/ProjectState" }
        stop_running:
          type: boolean
          description: With state closed, stop the terminals that are starting or running instead of refusing.

    TerminalState:
      type: string
      description: |
        starting: its holder is being started; running: its shell is alive;
        exited: its shell ended by itself; stopped: closing its project
        stopped it; failed: its holder or shell did not start; lost: its
        holder is gone and nobody stopped it.
      enum: [starting, running, exited, stopped, failed, lost]

    Terminal:
      type: object
      required: [id, name, project_id, project_name, dir, shell, state, pid, exit_code, error, created_at, updated_at, started_at, ended_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        dir: { type: string, description: "Where the shell starts, now and on every relaunch." }
        shell: { type: string, description: Absolute path of the shell. }
        state: { $ref: "#/components/schemas/TerminalState" }
        pid: { type: integer, nullable: true, description: "The shell's, while it has one." }
        exit_code:
          type: integer
          nullable: true
          description: Only when exited; 128 and the signal for a shell killed by one.
        error: { type: string, nullable: true, description: Only when failed; why it did not start. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When its state last changed. }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }

    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }

    TerminalEnvelope:
      type: object
      required: [terminal]
      properties:
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalResult:
      type: object
      required: [result, terminal]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalMessage:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          description: The text to type; Enter follows it.

    TerminalHistory:
      type: object
      required: [from, next, first, lines]
      properties:
        from: { type: integer, format: int64, description: The number of the first line in lines. }
        next: { type: integer, format: int64, description: The number the next line written will take. }
        first: { type: integer, format: int64, description: The number of the oldest line kept. }
        lines:
          type: array
          description: The lines as the terminal drew them, with their escape codes for styles and links.
          items: { type: string }

    AgentTranscript:
      type: object
      required: [path, from, next, lines]
      properties:
        path: { type: string, description: "The file on the daemon's machine, whole, for grep." }
        from: { type: integer, format: int64, description: The number of the first line in lines. }
        next: { type: integer, format: int64, description: The number the next line written will take. }
        lines:
          type: array
          description: The lines, oldest first, as Markdown.
          items: { type: string }

    AgentTranscriptEnvelope:
      type: object
      required: [transcript]
      properties:
        transcript: { $ref: "#/components/schemas/AgentTranscript" }

    TerminalHistoryEnvelope:
      type: object
      required: [history]
      properties:
        history: { $ref: "#/components/schemas/TerminalHistory" }

    OpenEditor:
      type: object
      required: [worktree, path]
      additionalProperties: false
      properties:
        worktree: { type: string, minLength: 1, description: The worktree's name, main for the clone. }
        project: { type: string, minLength: 1, description: 'The project''s name, or "id:" and its id; excludes dir.' }
        dir: { type: string, minLength: 1, description: An absolute path in one of the project's worktrees; excludes project. }
        path: { type: string, minLength: 1, description: The file's path, relative to the worktree. }

    AcaModel:
      type: object
      required: [id, name, default]
      properties:
        id: { type: string, description: "What its model flag takes, and createAgent's model." }
        name: { type: string, description: What a person reads. }
        default: { type: boolean, description: Whether it is what the AI coding agent runs when given no model. }

    AcaList:
      type: object
      required: [acas]
      properties:
        acas:
          type: array
          items: { $ref: "#/components/schemas/Aca" }

    Aca:
      type: object
      required: [id, default]
      properties:
        id: { type: string, description: "The AI coding agent's id, as claude_code." }
        default: { type: boolean, description: Whether createAgent runs it when given no aca. }

    AcaModelList:
      type: object
      required: [aca, models]
      properties:
        aca: { type: string, description: "The AI coding agent's id." }
        models:
          type: array
          items: { $ref: "#/components/schemas/AcaModel" }

    UsageWindow:
      type: object
      required: [aca, window, bucket, used_percent, resets_at, limited, observed_at]
      properties:
        aca: { type: string, description: "The AI coding agent's id." }
        window: { type: string, description: "The window's key as the ACA gives it, such as five_hour." }
        bucket: { type: string, description: "The bucket of models the window meters, as the ACA names it; empty for the one every model draws on." }
        used_percent: { type: integer, description: "0 to 100, or above once past the limit." }
        resets_at: { type: string, format: date-time, nullable: true, description: "When the window resets; null when the ACA gives none." }
        limited: { type: boolean, description: "Whether the window is used up: used_percent at 100 or more." }
        observed_at: { type: string, format: date-time, description: "When the ACA told it." }

    UsageList:
      type: object
      required: [usage]
      properties:
        usage:
          type: array
          items: { $ref: "#/components/schemas/UsageWindow" }

    Editor:
      type: object
      required: [terminal_id, worktree, path, program, state]
      properties:
        terminal_id: { type: string, description: The terminal it runs in, which a client attaches to. }
        worktree: { type: string, description: The worktree's name, main for the clone. }
        path: { type: string, description: The file's path, relative to the worktree. }
        program: { type: string, description: The editor, one of the editor setting's choices. }
        state: { $ref: "#/components/schemas/TerminalState" }

    EditorResult:
      type: object
      required: [result, editor]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        editor: { $ref: "#/components/schemas/Editor" }

    CreateTerminal:
      type: object
      required: [dir]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; by default the one whose worktree holds dir.
        dir:
          type: string
          description: Absolute path the shell starts in; see createTerminal.
        name:
          type: string
          nullable: true
          description: A generated adjective-noun codename by default; see updateAgent for what a name may hold.

    AgentState:
      type: string
      description: |
        Whether its process is alive, not what its AI coding agent is doing.
        starting: its holder is being started; running: its AI coding agent
        is alive; exited: it ended by itself; stopped: closing its project
        stopped it; failed: it did not start; lost: its holder is gone and
        nobody stopped it; removed: it is a tombstone, kept until its children
        are gone.
      enum: [starting, running, exited, stopped, failed, lost, removed]

    Agent:
      type: object
      required: [id, name, project_id, project_name, parent_agent_id, parent_agent_name, terminal_id, aca, session_id, dir, current_dir, held, worktree, task, state, activity, prompt, draft, queued, model, requested_model, permissions, context, pid, exit_code, error, created_at, updated_at, started_at, ended_at, removed_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        parent_agent_id: { type: string, nullable: true, description: "The agent it was created under; null at the top level." }
        parent_agent_name: { type: string, nullable: true, description: "That agent's name; null at the top level." }
        children:
          type: array
          description: The agents created under it, by name, with their children; set by listAgents, getAgent and getProject only.
          items: { $ref: "#/components/schemas/Agent" }
        terminal_id: { type: string, description: "What holds its process, which attaching dials; no terminal path accepts it." }
        aca: { type: string, description: "Which AI coding agent it runs, as claude_code." }
        session_id: { type: string, description: "The AI coding agent's latest session, which it goes on with when started again; changes when the conversation is cleared." }
        dir: { type: string, description: "Where it starts, now and on every relaunch." }
        held: { type: integer, description: "Messages for it that wait for a human: their holder died, and what they were meant for is gone." }
        current_dir: { type: string, nullable: true, description: "Where its AI CLI last said it worked, as after it moved into a worktree it made itself; null until it has, or when it does not say." }
        worktree: { type: string, nullable: true, description: "The name of the project's worktree holding dir, main for the clone; null when none does." }
        task: { $ref: "#/components/schemas/AgentTask" }
        state: { $ref: "#/components/schemas/AgentState" }
        activity:
          type: string
          nullable: true
          enum: [working, idle, waiting, unknown]
          description: What it is doing, while running; otherwise null. Unknown when its screen cannot be read, or its process was started by a wdx too old to say.
        prompt:
          allOf: [{ $ref: "#/components/schemas/AgentPrompt" }]
          nullable: true
          description: What it asks while its activity is waiting, as its screen shows it; null when no prompt is read, when it is not waiting, and when its process was started by a wdx too old to tell. Its text stays only while the prompt is open.
        draft: { type: boolean, nullable: true, description: "Whether a human left text in its input box, never the text, while running; otherwise null." }
        queued: { type: integer, nullable: true, description: "How many messages wait to go into it, as behind a draft, while running; otherwise null." }
        model: { type: string, nullable: true, description: "The AI model's name as its ACA last showed it, such as Haiku 5.5, for display, while running; otherwise null, as before it has shown one. A change it does not show, such as an automatic fallback, is not seen." }
        requested_model: { type: string, nullable: true, description: "The model it is started with every time, as it was asked for; null for its AI coding agent's default." }
        permissions: { $ref: "#/components/schemas/AgentPermissions" }
        context:
          allOf: [{ $ref: "#/components/schemas/AgentContext" }]
          nullable: true
          description: How full its context is, as its AI coding agent last told; null until it has, and again once a restart begins a new session. It stays once its terminal ends.
        pid: { type: integer, nullable: true, description: "The AI coding agent's, while it has one." }
        exit_code:
          type: integer
          nullable: true
          description: Only when exited; 128 and the signal for one killed by a signal.
        error: { type: string, nullable: true, description: Only when failed; why it did not start. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When its state last changed. }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true, description: When it was removed, if it is a tombstone. }

    AgentPrompt:
      type: object
      required: [kind, title, question, detail, options, selected, multi, ticked]
      properties:
        kind:
          type: string
          enum: [yes_no, decision]
          description: yes_no is answered yes or no in one of the AI coding agent's variants, as a permission, a plan approval or the trust prompt; decision is a question its model asks, with options of its own.
        title: { type: string, nullable: true, description: "What the AI coding agent heads it with, as Bash command, Create file, Accessing workspace, or a decision's tab; null when it has none." }
        question: { type: string, description: "The line that asks, as Do you want to proceed?" }
        detail: { type: string, nullable: true, description: "What a yes/no prompt is about: the command, the file's name, the workspace path; null when there is none." }
        options:
          type: array
          items: { type: string }
          description: Every option's label as shown, in order, without its number or box; a decision's hold the AI coding agent's own, as Type something and Chat about this.
        selected: { type: integer, nullable: true, description: "The index of the option the cursor is on; null when none shows." }
        multi: { type: boolean, description: "A decision whose options are checkboxes, several of which can be ticked." }
        ticked:
          type: array
          items: { type: integer }
          description: The index of each option whose box is ticked, in order; empty for a multi-select with none and for every other prompt.
    AgentContext:
      type: object
      required: [tokens, window]
      properties:
        tokens: { type: integer, format: int64, description: "The tokens in its context now." }
        window: { type: integer, format: int64, nullable: true, description: "Its model's context window, in tokens; null when its AI coding agent does not tell." }

    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }

    AgentEnvelope:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }

    AgentMessage:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          description: The text to give the agent; it is submitted.
        instant:
          type: boolean
          description: Go first, and interrupt the agent's turn if it is in one.

    AgentResult:
      type: object
      required: [result, agent]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        agent: { $ref: "#/components/schemas/Agent" }
        worktree_created:
          type: boolean
          description: True when creating the agent created its worktree; left out otherwise.
        prompt_error:
          type: string
          description: Why its prompt was not sent, with the agent running all the same; left out otherwise.
        stopped_sessions:
          type: array
          items: { type: string }
          description: The sessions of the agent that starting, restarting or removing it stopped outside its terminal, where its AI coding agent had moved them; left out when there were none.

    UpdateAgent:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Its new name; see updateAgent.

    CreateAgent:
      type: object
      required: [dir]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; by default the one whose worktree holds dir.
        dir:
          type: string
          description: Absolute path it starts in; see createAgent.
        name:
          type: string
          nullable: true
          description: A generated adjective-noun codename by default.
        parent:
          type: string
          nullable: true
          description: The agent to create it under, by "id:" and its id, or its name in the project named by project or holding dir; by default it has no parent.
        worktree:
          type: string
          nullable: true
          description: The worktree to start in, created when there is none of that name; see createAgent.
        prompt:
          type: string
          nullable: true
          description: Its task, as the first message in its inbox, which waits until it is ready for it; see sendAgent.
        model:
          type: string
          nullable: true
          description: The model its AI coding agent is told to use on every start, as that one's model flag takes it; by default its own default.
        permissions:
          allOf: [{ $ref: "#/components/schemas/AgentPermissions" }]
          nullable: true
          description: What it may do without asking, on every start; full by default.
        aca:
          type: string
          nullable: true
          description: The id of the AI coding agent it runs, as claude_code; by default the first installed and enabled, as listAcas lists them.

    AgentPermissions:
      type: string
      description: "What an agent may do without asking: full asks for no approval, with network access and no sandbox; ask is what its AI coding agent does by default, as the user's settings for it say."
      enum: [full, ask]

    DocStatus:
      type: string
      description: Whether a doc is agreed on; changing its content makes it wip.
      enum: [wip, review, approved, rejected]

    Doc:
      type: object
      required: [id, name, project_id, project_name, folder, format, labels, status, revision, size, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        folder: { type: string, description: "The folder tide shows it in, as /hub/initial; / for the top (wdx help docs)." }
        format: { type: string, description: "Its file extension, as md; empty for none." }
        labels:
          type: array
          items: { type: string }
          description: Sorted.
        status: { $ref: "#/components/schemas/DocStatus" }
        revision: { type: integer, format: int64, description: The latest. }
        size: { type: integer, format: int64, description: Bytes of the latest revision. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When anything about it last changed. }

    DocRevision:
      type: object
      required: [number, size, created_at]
      properties:
        number: { type: integer, format: int64 }
        size: { type: integer, format: int64, description: Bytes of its text. }
        created_at: { type: string, format: date-time }

    CreateDoc:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; excludes dir.
        dir:
          type: string
          nullable: true
          description: An absolute path in one of the project's worktrees; excludes project.
        name: { type: string, description: See createDoc. }
        folder: { type: string, default: /, description: See createDoc. }
        format: { type: string, default: md, description: Its file extension; see createDoc. }
        labels:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/DocStatus" }
        content: { type: string, default: "", description: The text of revision 1. }

    DocContentChange:
      type: object
      required: [base, content]
      additionalProperties: false
      properties:
        base: { type: integer, format: int64, minimum: 1, description: The revision the change was made on. }
        content: { type: string, description: The whole new text. }

    UpdateDoc:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, description: Its new name; excludes the others. }
        folder: { type: string, description: Its new folder; see createDoc. }
        status: { $ref: "#/components/schemas/DocStatus" }
        add_labels:
          type: array
          items: { type: string }
        remove_labels:
          type: array
          items: { type: string }

    SyncDocs:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; excludes dir.
        dir:
          type: string
          nullable: true
          description: An absolute path in one of the project's worktrees; excludes project.
        path:
          type: string
          minLength: 1
          description: The directory to write into, relative to the project's main checkout.

    DocSyncResult:
      type: object
      required: [result, path, written, removed, skipped]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        path: { type: string, description: The directory written into, absolute. }
        written:
          type: array
          items: { type: string }
          description: The files written, by name.
        removed:
          type: array
          items: { type: string }
          description: The files of docs that are gone, which wdx had written there.
        skipped:
          type: array
          items: { type: string }
          description: The docs' files not written, as a file wdx did not write has the name.

    DocList:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Doc" }

    DocRevisionList:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items: { $ref: "#/components/schemas/DocRevision" }

    DocContent:
      type: object
      required: [doc, revision, content]
      properties:
        doc: { $ref: "#/components/schemas/Doc" }
        revision: { type: integer, format: int64, description: The revision content is of. }
        content: { type: string }

    DocResult:
      type: object
      required: [result, doc]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        doc: { $ref: "#/components/schemas/Doc" }
        previous_status:
          $ref: "#/components/schemas/DocStatus"
          description: The status before a content change made it wip; left out otherwise.

    PlanState:
      type: string
      description: Where a plan is in its life; draft until it runs, then its run's state.
      enum: [draft, running, paused, done, cancelled]

    AgentTask:
      type: object
      nullable: true
      description: The plan's task the agent does; null for none.
      required: [plan, task]
      properties:
        plan: { type: string, description: The plan's name. }
        task: { type: string, description: The task's id. }

    Plan:
      type: object
      required: [id, name, project_id, project_name, folder, state, tasks, tasks_done, tasks_failed, plans, plans_done, plans_waiting, parent, archived_at, slots, revision, size, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        folder: { type: string, description: "The folder tide shows it in, as /hub/initial; / for the top. A plan of plans and the plans it lists always have the same one (wdx help plans)." }
        state: { $ref: "#/components/schemas/PlanState" }
        tasks: { type: integer, format: int64, nullable: true, description: How many tasks it has; null for a plan of plans. }
        tasks_done: { type: integer, format: int64, nullable: true, description: How many of them its run has done; null for a draft and a plan of plans. }
        tasks_failed: { type: integer, format: int64, nullable: true, description: How many of them are failed or land_failed, waiting for the person; null for a draft and a plan of plans. }
        plans:
          type: array
          items: { type: string }
          nullable: true
          description: The plans it lists, in DAG order; null for a plan of tasks.
        plans_done: { type: integer, format: int64, nullable: true, description: How many of the plans it lists are done; null for a draft and a plan of tasks. }
        plans_waiting:
          type: array
          items: { type: string }
          nullable: true
          description: The plans it lists that wait for the person, as PlanChild.waiting says, in DAG order; empty when none, null for a plan of tasks.
        parent: { type: string, nullable: true, description: The plan of plans listing it; null for none. }
        archived_at: { type: string, format: date-time, nullable: true, description: When it was archived, which leaves it out of listPlans; null when it is not. }
        slots:
          type: array
          items: { $ref: "#/components/schemas/PlanSlot" }
          description: Its run's worktrees, by number, while it has any; empty for a draft and a run over, whose worktrees are then ordinary.
        revision: { type: integer, format: int64, description: The latest. }
        size: { type: integer, format: int64, description: Bytes of the latest revision. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When anything about it last changed. }

    PlanDefinition:
      type: object
      description: What a revision of a plan says, so that no client parses the YAML.
      required: [goal, constraints, tasks, plans]
      properties:
        goal: { type: string }
        constraints:
          type: array
          items: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/PlanTask" }
          nullable: true
          description: In DAG order; null for a plan of plans.
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanChild" }
          nullable: true
          description: In DAG order; null for a plan of tasks.

    PlanTask:
      type: object
      required: [id, after, prompt, state, waiting_for, failure, conflicts, check_terminal, agent, slot_path, summary, started_at, finished_at]
      properties:
        id: { type: string }
        after:
          type: array
          items: { type: string }
          description: The tasks it waits for.
        prompt: { type: string }
        state: { $ref: "#/components/schemas/PlanTaskState" }
        waiting_for:
          type: array
          items: { type: string }
          description: The tasks of after not yet done or skipped; a pending task with none is ready, waiting for a worktree.
        failure: { $ref: "#/components/schemas/PlanTaskFailure" }
        conflicts:
          type: array
          items: { type: string }
          nullable: true
          description: The files a landing's rebase stopped on; null unless it is land_failed with rebase.
        check_terminal: { type: string, nullable: true, description: The terminal holding the output of the check that failed; null unless it is land_failed with check. }
        agent: { $ref: "#/components/schemas/PlanTaskAgent" }
        slot_path: { type: string, nullable: true, description: The plan's worktree it has; null when it has none. }
        summary: { type: string, nullable: true, description: What its agent said it did; null until it is done. }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    PlanTaskState:
      type: string
      description: Where a task is in its plan's run; pending in a draft.
      enum: [pending, running, landing, land_failed, failed, done, skipped]

    PlanTaskFailure:
      type: string
      nullable: true
      description: Why a task is failed or land_failed; null otherwise.
      enum: [agent_ended, start_failed, slot_missing, rebase, check]

    PlanTaskAgent:
      type: object
      nullable: true
      description: The agent doing the task, or that did it; null when it has none, as once the task is done or skipped, or its plan cancelled, which removes its agent.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    PlanRun:
      type: object
      nullable: true
      description: A plan's run; null for a draft.
      required: [state, paused_reason, revision, base, branch, parallel, started_at, finished_at]
      properties:
        state: { $ref: "#/components/schemas/PlanState" }
        paused_reason:
          type: string
          nullable: true
          enum: [person, project_closed]
          description: Why it is paused, null unless it is; project_closed shows a running plan paused while its project is closed, which goes on as it was when the project opens.
        revision: { type: integer, format: int64, description: The revision it runs. }
        base: { type: string, description: The branch it started from. }
        branch: { type: string, description: Where its tasks land, plan/<name>. }
        parallel: { type: integer, nullable: true, description: The most tasks it runs at once; null follows plan.parallel. }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    RunPlan:
      type: object
      additionalProperties: false
      properties:
        parallel: { type: integer, minimum: 1, maximum: 20, description: The most tasks it runs at once; plan.parallel when left out. }

    FinishPlanTask:
      type: object
      required: [summary]
      additionalProperties: false
      properties:
        summary: { type: string, minLength: 1, description: What was done, in a few lines, for the tasks that wait for it. }

    PlanTaskResult:
      type: object
      required: [result, task]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        task: { $ref: "#/components/schemas/PlanTask" }

    PlanChild:
      type: object
      required: [id, after, state, tasks, tasks_done, waiting, stacked_on]
      properties:
        id: { type: string, description: The plan's name. }
        stacked_on:
          type: string
          nullable: true
          description: The plan whose branch it started on, as its stacked parent started it, while its base is that branch; null once R moved it onto the default branch, and for one not stacked.

        after:
          type: array
          items: { type: string }
          description: The plans it waits for.
        state: { $ref: "#/components/schemas/PlanState" }
        tasks: { type: integer, format: int64, description: How many tasks it has. }
        tasks_done: { type: integer, format: int64, nullable: true, description: How many of them its run has done; null for a draft. }
        waiting:
          type: boolean
          description: >-
            It waits for the person: a draft whose plans before it are done but not all
            in the default branch, or that its parent failed to start, while its parent
            runs.

    PlanDropped:
      type: object
      description: An after reduction took out, as another of the entry's afters already waits for it.
      required: [entry, after, via]
      properties:
        entry: { type: string, description: The task or plan that waited. }
        after: { type: string, description: What it no longer waits for directly. }
        via: { type: string, description: The other after that already waits for it. }

    PlanProblem:
      type: object
      description: One thing wrong with a plan's YAML; invalid_plan lists every one under details.problems.
      required: [line, message]
      properties:
        line: { type: integer, format: int64 }
        message: { type: string }

    CreatePlan:
      type: object
      required: [name, content]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; excludes dir.
        dir:
          type: string
          nullable: true
          description: An absolute path in one of the project's worktrees; excludes project.
        name: { type: string, description: See createPlan. }
        folder: { type: string, default: /, description: See createPlan. }
        content: { type: string, description: The plan's YAML. }

    PlanSlot:
      type: object
      required: [slot, path, task]
      properties:
        slot: { type: integer, description: Its number, 1 first. }
        path: { type: string, description: The worktree's absolute path. }
        task: { type: string, nullable: true, description: The id of the task in it; null for a free one. }

    CopyPlan:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, description: The copy's name; see createPlan. }
        folder: { type: string, description: "Its folder; the plan's when absent. See createPlan." }

    UpdatePlan:
      type: object
      additionalProperties: false
      description: name, or folder, parallel or both.
      properties:
        name: { type: string, description: A draft's new name; excludes the others. }
        folder: { type: string, description: Its new folder, and its family's; see updatePlan. }
        parallel: { type: integer, minimum: 1, maximum: 20, description: The most tasks its run runs at once. }

    RetryPlanTask:
      type: object
      additionalProperties: false
      properties:
        fresh: { type: boolean, description: Start a new agent even when the task's could be resumed. }

    PlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/Plan" }

    PlanContent:
      type: object
      required: [plan, revision, content, definition, run]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        revision: { type: integer, format: int64, description: The revision content is of. }
        content: { type: string }
        definition: { $ref: "#/components/schemas/PlanDefinition" }
        run: { $ref: "#/components/schemas/PlanRun" }

    PlanResult:
      type: object
      required: [result, plan]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        plan: { $ref: "#/components/schemas/Plan" }
        dropped:
          type: array
          items: { $ref: "#/components/schemas/PlanDropped" }
          description: The afters reduction took out, empty when none; set by createPlan and updatePlanContent only.
        moved:
          type: array
          items: { type: string }
          description: The other plans whose folder changed with this one's, as a plan of plans and its plans share one, empty when none; set by createPlan, updatePlanContent and updatePlan only.

    ErrorCode:
      type: string
      description: |
        Stable error code; never changed or reused. daemon_unavailable,
        already_running, tide_running, runtime_missing, port_in_use, runtime_failed,
        agent_not_running, attach_unsupported,
        connection_lost, the
        codes of wdx update (download_failed to restore_required) and of
        wdx deps install (cancelled to privileges_required) are reported
        by the CLI, never by the daemon.
      enum:
        - usage
        - internal
        - not_found
        - name_taken
        - repo_exists
        - checkout_missing
        - not_git_repo
        - invalid_name
        - invalid_path
        - invalid_argument
        - path_exists
        - project_mismatch
        - clone_failed
        - project_closed
        - project_in_use
        - terminal_running
        - start_failed
        - terminal_not_running
        - send_failed
        - agent_running
        - agent_removed
        - branch_exists
        - worktree_failed
        - land_not_configured
        - agent_working
        - not_committed
        - nothing_to_land
        - no_local_base
        - landing_running
        - worktree_busy
        - rebase_failed
        - check_failed
        - base_moved
        - fast_forward_failed
        - push_failed
        - pr_failed
        - detached_head
        - worktree_is_clone
        - worktree_not_landed
        - worktree_not_removed
        - agent_not_running
        - agent_busy
        - attach_unsupported
        - connection_lost
        - daemon_unavailable
        - already_running
        - runtime_missing
        - port_in_use
        - runtime_failed
        - download_failed
        - checksum_mismatch
        - older_version
        - update_running
        - update_failed
        - no_previous_version
        - restore_required
        - settings_invalid
        - reload_failed
        - invalid_setting
        - cancelled
        - unsupported_system
        - install_failed
        - privileges_required
        - dependency_missing
        - editor_running
        - doc_changed
        - tide_running
        - invalid_plan
        - plan_changed
        - plan_in_use
        - plan_started
        - task_state
        - wrong_branch
        - plan_not_running
        - plan_not_finished
        - aca_unsupported
        - aca_unavailable
        - worktree_in_plan
        - plan_not_landed
        - base_not_pulled

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457).
      required: [type, title, status, detail, code, hint, details, debug_id]
      properties:
        type: { type: string, description: "urn:wdx:error: and the code." }
        title: { type: string, description: What the code means. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        hint: { type: string, nullable: true, description: What to do about it. }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: The values involved, such as the conflicting project.
        debug_id: { type: string, description: Finds the request's log lines. }
