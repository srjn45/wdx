openapi: 3.0.3
info:
  title: wdx daemon API
  version: v1
  description: |
    The API of the wdx daemon, served over the Unix socket <home>/wdx.sock.

    A request may send a Wdx-Debug-Id header (dbg- and 12 hex digits) to have
    the daemon log it under that id; the response echoes the id the request
    was logged under. A Wdx-Log-Level header of debug has the daemon log the
    request at debug level, its failures excepted, as for tab completions;
    any other value is ignored.

    Errors are Problem Details (RFC 9457) with a stable "code"; each
    operation lists the codes it can return besides usage and internal.
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Version of the daemon
      responses:
        "200":
          description: The name, version and commit the daemon was built from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/daemon:
    get:
      operationId: getDaemon
      summary: The daemon serving this socket
      responses:
        "200":
          description: Its build, process, home and socket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Daemon" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/daemon/reload:
    post:
      operationId: reloadDaemon
      summary: Read the settings again and apply them
      description: |
        Terminals already running keep their shell and history limit. When the
        config file cannot be used, the daemon keeps the values it has and
        fails with reload_failed. It does not wait for other changes in
        flight, since a clone can take minutes.
      responses:
        "200":
          description: The settings were applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings:
    get:
      operationId: listSettings
      summary: Every setting, with its value in the config file now
      description: "Errors: reload_failed, when the config file cannot be used."
      responses:
        "200":
          description: The settings, in the order of their table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/{setting}:
    parameters:
      - name: setting
        in: path
        required: true
        description: The setting's dotted key, such as log.level.
        schema: { type: string }
    patch:
      operationId: updateSetting
      summary: Change a setting and apply it at once
      description: |
        The value is checked, saved in the config file, then applied as
        reloadDaemon applies it, even when it is what the file has. The file is
        written anew, so comments of its own are not kept. It does not wait for
        other changes in flight, since a clone can take minutes.

        Errors: invalid_setting, not_found, reload_failed, when the value was
        saved but the daemon cannot apply the file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSetting" }
      responses:
        "200":
          description: The setting, with result updated, or unchanged when the file already had it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects, without their worktrees, sorted by name
      parameters:
        - name: state
          in: query
          description: Only projects in this state; every project when absent.
          schema: { $ref: "#/components/schemas/ProjectState" }
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: Create a project or open a git repository as one
      description: |
        source.type picks what happens:
        - new: create an empty git repository at <path>/<name> (path defaults
          to <home>/projects) and open it. An existing directory that is not
          in a git repository is initialized in place. When the name is taken
          or the directory is in a git repository, on_conflict "open" opens
          that project instead and returns the conflict under "conflict";
          without it the conflict is returned as the error.
        - local: open the repository holding path. Worktrees and other clones
          of a known repository join its project.
        - git: open the project with that origin, or clone it into
          <home>/projects/<name> if it is unknown.

        Opening a known project marks it open, drops its checkouts no longer
        on disk and relaunches the terminals and agents closing it stopped, listing
        them under "started" and "started_agents". When no checkout is left, on_missing_checkout
        "reclone" clones it again and "remove" removes it, which terminals
        and agents still running refuse with project_in_use; without it checkout_missing
        is returned.

        Errors: checkout_missing, clone_failed, invalid_argument,
        invalid_name, invalid_path, name_taken, not_git_repo, path_exists,
        project_in_use, project_mismatch, repo_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "200":
          description: An existing project was opened, or removed by on_missing_checkout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        "201":
          description: A project was created, registered or cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: getProject
      summary: A project, open or closed, with which of its checkouts are on disk and its terminals and agents
      description: "Errors: not_found."
      responses:
        "200":
          description: The project, with "present" on each worktree, "orphaned", "terminals" and "agents" set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      summary: Close a project, or open it again from one of its checkouts
      description: |
        Closing touches nothing on disk. It stops the project's terminals and
        agents that are starting or running, which it refuses with
        project_in_use unless stop_running is true, and lists them under
        "stopped" and "stopped_agents".

        Opening drops the checkouts no longer on disk; when none is left,
        checkout_missing is returned. It relaunches the terminals and agents
        closing stopped and lists them under "started" and "started_agents",
        each in the state it reached.

        Errors: checkout_missing, not_found, project_in_use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: The project, with result closed or opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProject
      summary: Delete a project and everything that belongs to it
      description: |
        Files on disk are not touched. Terminals starting or running refuse
        it with project_in_use unless stop_running is true, which stops them
        first and lists them under "stopped".

        Errors: not_found, project_in_use.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed project, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: streamProject
      summary: Follow a project, sent whole every time it changes
      description: |
        Server-sent events (text/event-stream) for as long as the client
        stays. The first event is the project as getProject returns it;
        after every change under it (the project opened or closed, a
        terminal created, changing state or removed, whoever made it) the
        project is sent whole again, never a delta, so a client replaces
        what it holds. Changes close together may be sent as one.

        Each event is "event: project" with a ProjectEnvelope as its data.
        When the project is removed, "event: removed" with a ProjectRemoved
        ends the stream. The project is followed by its id, so a rename
        keeps it. The stream also ends when the daemon stops.

        With worktrees, each event also has "worktree_statuses", once they
        are read. Only while such a stream is open does the daemon read them,
        and only when something says they changed: it runs no git on a timer.

        Errors: not_found.
      parameters:
        - name: worktrees
          in: query
          description: Keep "worktree_statuses" up to date in the events.
          schema: { type: boolean }
      responses:
        "200":
          description: The stream of the project's events.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/worktrees:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    post:
      operationId: recloneProject
      summary: Clone a project with no checkout left back into its clone path
      description: |
        Relaunches the terminals closing the project stopped, as opening it
        does.

        Errors: clone_failed, invalid_argument, not_found, path_exists.
      responses:
        "201":
          description: The project, with result cloned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/projects/{project}/worktrees/refresh:
    parameters:
      - $ref: "#/components/parameters/ProjectRef"
    post:
      operationId: refreshWorktrees
      summary: Read the "worktree_statuses" of a project's streams again now
      description: |
        Answers at once: the streams send what it finds. It does nothing when
        no stream with worktrees follows the project. Unlike the reads that
        happen by themselves, it does not wait for an index lock.

        Errors: not_found.
      parameters:
        - name: worktree
          in: query
          description: The worktree's name; all of them when not given or not known.
          schema: { type: string }
      responses:
        "202": { description: The read was asked for. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees:
    get:
      operationId: listWorktrees
      summary: List every checkout git lists for a project, with its changes
      description: |
        The checkouts of the project named by project, or of the project whose
        worktree holds dir; one of them must be given. Read from git now, without
        writing to the repository or downloading anything.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
      responses:
        "200":
          description: The worktrees.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/diff:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
    get:
      operationId: getWorktreeDiff
      summary: What a worktree has committed since it left its base, as a PR shows it, or what it has not committed
      description: |
        Measured from the merge base, so that later commits on the base are not
        removals. What is not committed is not in it.

        With uncommitted, the patch is instead everything not committed, staged,
        not staged and untracked, with base, merge_base and ahead null.

        In a partial clone, what it takes is downloaded.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
        - name: uncommitted
          in: query
          description: Show what is not committed instead.
          schema: { type: boolean }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeDiff" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files/diff:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
    get:
      operationId: getWorktreeFileDiff
      summary: The uncommitted changes of a file, with all of its lines
      description: |
        Staged, not staged or untracked, against HEAD. The patch is empty when the
        file has no uncommitted changes. In a partial clone, what it takes is
        downloaded.

        Errors: invalid_path, not_found, usage.
      parameters:
        - $ref: "#/components/parameters/WorktreeProject"
        - $ref: "#/components/parameters/WorktreeDir"
        - name: path
          in: query
          required: true
          description: The file's path, relative to the worktree.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileDiff" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/worktrees/{worktree}/files/verified:
    parameters:
      - $ref: "#/components/parameters/WorktreeRef"
      - $ref: "#/components/parameters/WorktreeProject"
      - $ref: "#/components/parameters/WorktreeDir"
      - name: path
        in: query
        required: true
        description: The file's path, relative to the worktree.
        schema: { type: string, minLength: 1 }
    put:
      operationId: verifyWorktreeFile
      summary: Mark a file verified
      description: |
        A label a human gives a file, which nothing else depends on. It holds for
        as long as the file has the content marked: the next read of the worktree
        that finds it edited takes it away.

        Errors: invalid_path, not_found, usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorktreeFileVerify" }
      responses:
        "200":
          description: The file, marked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileMark" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unverifyWorktreeFile
      summary: Take a file's verified mark away
      description: |
        Errors: invalid_path, not_found, usage.
      responses:
        "200":
          description: The file, not marked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFileMark" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals:
    get:
      operationId: listTerminals
      summary: List terminals by project name, then name
      description: |
        The terminals of the project named by project, or of the project whose
        worktree holds dir; of every project when neither is given.

        Errors: invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
      responses:
        "200":
          description: The terminals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTerminal
      summary: Create a terminal and start its shell
      description: |
        Without project, the terminal belongs to the project whose worktree
        holds dir, the longest path winning, and its shell starts in dir.
        With project, it starts in dir when dir is in one of the project's
        worktrees, else in the project's clone path.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_name, invalid_path, name_taken, not_found,
        project_closed, start_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTerminal" }
      responses:
        "201":
          description: The terminal, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminal
      summary: A terminal, in any state
      description: "Errors: invalid_path, not_found."
      responses:
        "200":
          description: The terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTerminal
      summary: Delete a terminal
      description: |
        A terminal starting or running refuses it with terminal_running
        unless stop_running is true, which stops its shell first.

        Errors: invalid_path, not_found, terminal_running.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed terminal, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/start:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: startTerminal
      summary: Start a fresh shell for a terminal whose last one ended
      description: |
        For a terminal that exited, failed or was lost; never for one stopped
        by closing its project, which opening it relaunches.

        A shell that does not start leaves the terminal failed and returns
        start_failed with the terminal under details.terminal.

        Errors: invalid_path, not_found, project_closed, start_failed, terminal_running.
      responses:
        "200":
          description: The terminal, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/send:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: sendTerminal
      summary: Queue a message for a running terminal's shell
      description: |
        The message goes in the inbox of the terminal's holder, which types it
        into the shell and presses Enter; it may not have reached the shell
        when this returns. It is lost if the shell ends first.

        A message that does not reach the holder returns send_failed with the
        terminal under details.terminal: the holder is too old and the terminal
        must be restarted, or the message does not fit in 1 MiB.

        Errors: invalid_path, not_found, send_failed, terminal_not_running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalMessage" }
      responses:
        "200":
          description: The terminal, with result queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/terminals/{terminal}/history:
    parameters:
      - $ref: "#/components/parameters/TerminalRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getTerminalHistory
      summary: Lines of a terminal's history, in any state
      description: |
        History is the lines that scrolled off the terminal's screen,
        numbered from 0 for the terminal's life, across relaunches of its
        shell, and kept up to terminal.history_lines. With from or count,
        the count lines from that number on, from 0 when not given; else
        the last tail lines. A from before the oldest line kept starts at
        that one.

        Errors: invalid_path, not_found; tail with from or count is a usage
        error.
      parameters:
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHistoryEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents as trees, by project name, then name
      description: |
        The agents of the project named by project, or of the project whose
        worktree holds dir, or of every project without either; every state
        is listed. The top level has the agents with no parent, the rest are
        in their parents' children.

        Errors: invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/TerminalProject"
        - $ref: "#/components/parameters/TerminalDir"
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgent
      summary: Create an agent and start its AI coding agent
      description: |
        Without project, the agent belongs to the project whose worktree
        holds dir, and starts there. With it, in dir when dir is in the
        project, else in the project's clone path. With parent, it is a child
        of that agent: it belongs to the parent's project and starts in the
        parent's dir, whatever dir is.

        With worktree, it starts in that worktree of the project instead:
        "main" is the clone, any other name matches the base name of a
        worktree's path. A name that matches none creates the worktree in
        <project root>/.worktrees/<name>, on a new branch of that name from the
        HEAD of where it would otherwise start, and excludes .worktrees from
        git unless git already ignores it. A worktree created stays when the
        agent then fails, and the next request finds it.

        An agent that does not start is left failed and returns start_failed
        with the agent under details.agent.

        Errors: agent_removed, branch_exists, invalid_name, invalid_path,
        name_taken, not_found, path_exists, project_closed, start_failed,
        worktree_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgent" }
      responses:
        "201":
          description: The agent, with result created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgent
      summary: An agent, in any state
      description: "Errors: invalid_path, not_found."
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAgent
      summary: Rename an agent
      description: |
        Its process, session and id stay as they are. A name is trimmed, and
        then has one or more of A-Z, a-z, 0-9 and "-". Names are unique within
        a project among agents and terminals, tombstones too, ignoring case;
        an agent may change the case of its own. A tombstone cannot be
        renamed.

        Errors: agent_removed, invalid_name, invalid_path, name_taken,
        not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgent" }
      responses:
        "200":
          description: The agent, with result renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      description: |
        An agent starting or running refuses it with agent_running unless
        stop_running is true. One with children stays as a tombstone, with
        state removed, until its last child is removed, and it is then
        deleted; removing a tombstone that has children refuses it with
        agent_removed. What the AI coding agent keeps of its session
        stays on disk.

        Errors: agent_removed, agent_running, invalid_path, not_found.
      parameters:
        - $ref: "#/components/parameters/StopRunning"
      responses:
        "200":
          description: The removed agent, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/start:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: startAgent
      summary: Start an agent whose AI coding agent ended, in the same session
      description: |
        For an agent that exited, failed or was lost. One that does not start
        is left failed and returns start_failed with the agent under
        details.agent.

        Errors: agent_removed, agent_running, invalid_path, not_found, project_closed,
        start_failed.
      responses:
        "200":
          description: The agent, with result started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/send:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    post:
      operationId: sendAgent
      summary: Queue a message for a running agent
      description: |
        The message goes in the inbox of the agent's holder, which delivers it
        once its screen allows: never while text is in its input box or a prompt
        is open, nor on a screen it cannot read. It may not have reached the
        agent when this returns, and is lost if the agent ends first.

        With instant it goes before the general messages and, when the agent is
        in a turn, its turn is interrupted first.

        A message that does not reach the holder returns send_failed with the
        agent under details.agent: the holder is too old and the agent must be
        restarted, or the message does not fit in 1 MiB.

        Errors: agent_not_running, agent_removed, invalid_path, not_found,
        send_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "200":
          description: The agent, with result queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/agents/{agent}/history:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgentHistory
      summary: Lines of an agent's history, in any state
      description: |
        As getTerminalHistory, of the lines that scrolled off the agent's
        screen.

        Errors: invalid_path, not_found; tail with from or count is a usage
        error.
      parameters:
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHistoryEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/agents/{agent}/transcript:
    parameters:
      - $ref: "#/components/parameters/AgentRef"
      - $ref: "#/components/parameters/TerminalProject"
      - $ref: "#/components/parameters/TerminalDir"
    get:
      operationId: getAgentTranscript
      summary: Lines of an agent's conversation as text, in any state
      description: |
        wdx's backup of the conversation, across its compactions and sessions,
        kept until the agent is removed and brought up to date first. Unlike
        getAgentHistory, this is what the agent and the human said and did, not
        what the screen showed.

        Errors: invalid_path, not_found; tail with from or count is a usage
        error.
      parameters:
        - name: from
          in: query
          description: The number of the first line; excludes tail.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: count
          in: query
          description: Lines from from on, or from 0 without from; 1000 when not given; excludes tail.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: tail
          in: query
          description: The last lines; excludes from and count; 1000 when none is given.
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTranscriptEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    WorktreeRef:
      name: worktree
      in: path
      required: true
      description: The worktree's name, main for the clone.
      schema: { type: string, minLength: 1 }
    WorktreeProject:
      name: project
      in: query
      description: The project's name, or "id:" and its id; excludes dir.
      schema: { type: string, minLength: 1 }
    WorktreeDir:
      name: dir
      in: query
      description: An absolute path in one of the project's worktrees; excludes project.
      schema: { type: string, minLength: 1 }
    ProjectRef:
      name: project
      in: path
      required: true
      description: The project's name (case-insensitive), or "id:" and its id, as in id:proj-1a2b3c4d.
      schema: { type: string, minLength: 1 }
    TerminalRef:
      name: terminal
      in: path
      required: true
      description: |
        "id:" and the terminal's id, as in id:term-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    TerminalProject:
      name: project
      in: query
      description: The project's name, or "id:" and its id; excludes dir.
      schema: { type: string, minLength: 1 }
    TerminalDir:
      name: dir
      in: query
      description: An absolute path in one of the project's worktrees; excludes project.
      schema: { type: string, minLength: 1 }
    AgentRef:
      name: agent
      in: path
      required: true
      description: |
        "id:" and the agent's id, as in id:agent-1a2b3c4d, or its name
        (case-insensitive) together with project or dir, since names are
        unique only within a project.
      schema: { type: string, minLength: 1 }
    StopRunning:
      name: stop_running
      in: query
      description: Stop the terminals and agents that are starting or running instead of refusing.
      schema: { type: boolean, default: false }

  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Version:
      type: object
      required: [name, version, commit]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }

    Daemon:
      type: object
      required: [name, version, commit, pid, home, socket, started_at]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }
        pid: { type: integer }
        home: { type: string }
        socket: { type: string }
        started_at: { type: string, format: date-time }

    ProjectState:
      type: string
      enum: [open, closed]

    Setting:
      type: object
      required: [key, value, default, description, from, choices, editable]
      properties:
        key: { type: string, description: "Its dotted key, such as log.level." }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        from: { type: string, description: "Where the value comes from: the default, the file and line, or the variable." }
        choices:
          type: array
          nullable: true
          description: The values to choose among, when it takes a fixed set; null when it takes any text or number.
          items: { type: string }
        editable: { type: boolean, description: "False when it is not read from the config file, so it cannot be set here." }

    SettingList:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }

    UpdateSetting:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string, description: "Its new value; empty for the settings that take that." }

    SettingResult:
      type: object
      required: [result, setting]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        setting: { $ref: "#/components/schemas/Setting" }

    ReloadResult:
      type: object
      required: [result]
      properties:
        result: { $ref: "#/components/schemas/Result" }

    Result:
      type: string
      description: The most significant thing that happened.
      enum: [created, registered, cloned, opened, closed, removed, started, detached, exited, reloaded, queued, renamed, updated, unchanged]

    Worktree:
      type: object
      required: [id, path, created_at]
      properties:
        id: { type: string }
        path: { type: string }
        present:
          type: boolean
          description: Whether the checkout is on disk; set by getProject only.
        created_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, origin, state, worktrees, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        orphaned:
          type: boolean
          description: Whether none of the checkouts is on disk; set by getProject only.
        worktrees:
          type: array
          items: { $ref: "#/components/schemas/Worktree" }
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }
          description: The project's terminals by name, in every state; set by getProject only.
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
          description: The project's agents with no parent by name, in every state, with their children; set by getProject only.
        worktree_statuses:
          type: array
          items: { $ref: "#/components/schemas/WorktreeStatus" }
          description: Every checkout git lists, as last read; set only by streamProject with worktrees, once read.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorktreeStatus:
      type: object
      required: [name, path, branch, head, missing, base, ahead, added, removed, files, committed_files]
      properties:
        name: { type: string, description: "main for the clone, else the last part of its path, with a number if that is taken." }
        path: { type: string }
        branch: { type: string, nullable: true, description: "Null when HEAD is detached." }
        head: { type: string, nullable: true, description: "Null with no commit yet." }
        missing: { type: boolean, description: "Its directory is gone." }
        base: { type: string, nullable: true, description: "What its commits are measured against: the default branch, or the same on origin when it is on that branch; null when there is neither." }
        ahead: { type: integer, nullable: true, description: "Commits it has that base has not; null when not known." }
        added: { type: integer, nullable: true, description: "Lines those commits add; null when not known, as in a partial clone." }
        removed: { type: integer, nullable: true, description: "Lines those commits remove; null when not known." }
        files:
          type: array
          items: { $ref: "#/components/schemas/WorktreeFile" }
          description: The files with uncommitted changes, by path.
        committed_files:
          type: array
          items: { $ref: "#/components/schemas/WorktreeCommittedFile" }
          description: The files its commits changed since it left base, by path.

    WorktreeCommittedFile:
      type: object
      required: [path, status, verified]
      properties:
        path: { type: string, description: "Relative to the worktree." }
        status:
          type: string
          enum: [M, A, D]
          description: M changed, A added, D deleted.
        verified: { type: boolean, description: "A human marked it verified, and it has not changed since." }

    WorktreeFileMark:
      type: object
      required: [worktree, path, verified]
      properties:
        worktree: { type: string }
        path: { type: string }
        verified: { type: boolean }

    WorktreeFileVerify:
      type: object
      properties:
        content_id:
          type: string
          description: The file's blob id as the patch looked at says it; the content it has now when not given.

    WorktreeFile:
      type: object
      required: [path, status, size, modified_at, verified]
      properties:
        path: { type: string, description: "Relative to the worktree." }
        status:
          type: string
          enum: [M, A, D, "?", U]
          description: M changed, A added, D deleted, ? untracked, U in conflict.
        size: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time, nullable: true, description: "Null for a deleted file." }
        verified: { type: boolean, description: "A human marked it verified, and it has not changed since." }

    WorktreeList:
      type: object
      required: [worktrees]
      properties:
        worktrees:
          type: array
          items: { $ref: "#/components/schemas/WorktreeStatus" }

    WorktreeDiff:
      type: object
      required: [worktree, base, merge_base, ahead, patch, binary, truncated]
      properties:
        worktree: { type: string }
        base: { type: string, nullable: true, description: "As in WorktreeStatus." }
        merge_base: { type: string, nullable: true, description: "Null when it shares no history with base, or has none." }
        ahead: { type: integer, nullable: true }
        patch: { type: string, description: "The unified diff; empty when nothing is ahead." }
        binary: { type: boolean, description: "A file in it is binary, and only said to differ." }
        truncated: { type: boolean, description: "Too long: patch is its beginning." }

    WorktreeFileDiff:
      type: object
      required: [worktree, path, patch, binary, truncated]
      properties:
        worktree: { type: string }
        path: { type: string }
        patch: { type: string, description: "The unified diff with every line of the file; empty when nothing is uncommitted." }
        binary: { type: boolean, description: "The file is binary, and only said to differ." }
        truncated: { type: boolean, description: "Too long: patch is its beginning." }

    ProjectSummary:
      type: object
      required: [id, name, origin, state, worktree_count, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ProjectState" }
        worktree_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }

    ProjectEnvelope:
      type: object
      required: [project]
      properties:
        project: { $ref: "#/components/schemas/Project" }

    ProjectRemoved:
      type: object
      description: The data of streamProject's removed event.
      required: [project_id]
      properties:
        project_id: { type: string }

    ProjectResult:
      type: object
      required: [result, project]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        project: { $ref: "#/components/schemas/Project" }
        dropped:
          type: array
          description: The checkouts dropped because they are no longer on disk.
          items: { $ref: "#/components/schemas/Worktree" }
        conflict:
          $ref: "#/components/schemas/Problem"
        started:
          type: array
          description: The terminals opening the project relaunched, in the state each reached.
          items: { $ref: "#/components/schemas/Terminal" }
        stopped:
          type: array
          description: The terminals closing or removing the project stopped.
          items: { $ref: "#/components/schemas/Terminal" }
        started_agents:
          type: array
          description: The agents opening the project relaunched, in the state each reached.
          items: { $ref: "#/components/schemas/Agent" }
        stopped_agents:
          type: array
          description: The agents closing or removing the project stopped.
          items: { $ref: "#/components/schemas/Agent" }

    CreateProject:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/Source" }
        name:
          type: string
          description: Required for source new; otherwise the repository directory or URL name by default.
        on_conflict:
          type: string
          enum: [open, cancel]
        on_missing_checkout:
          type: string
          enum: [reclone, remove]

    Source:
      oneOf:
        - $ref: "#/components/schemas/NewSource"
        - $ref: "#/components/schemas/LocalSource"
        - $ref: "#/components/schemas/GitSource"
      discriminator:
        propertyName: type
        mapping:
          new: "#/components/schemas/NewSource"
          local: "#/components/schemas/LocalSource"
          git: "#/components/schemas/GitSource"

    NewSource:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [new] }
        path:
          type: string
          description: Absolute directory to create the repository in; <home>/projects by default.

    LocalSource:
      type: object
      required: [type, path]
      additionalProperties: false
      properties:
        type: { type: string, enum: [local] }
        path:
          type: string
          description: Absolute path in a git repository.

    GitSource:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: { type: string, enum: [git] }
        url: { type: string, description: Clone URL. }

    UpdateProject:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { $ref: "#/components/schemas/ProjectState" }
        stop_running:
          type: boolean
          description: With state closed, stop the terminals that are starting or running instead of refusing.

    TerminalState:
      type: string
      description: |
        starting: its holder is being started; running: its shell is alive;
        exited: its shell ended by itself; stopped: closing its project
        stopped it; failed: its holder or shell did not start; lost: its
        holder is gone and nobody stopped it.
      enum: [starting, running, exited, stopped, failed, lost]

    Terminal:
      type: object
      required: [id, name, project_id, project_name, dir, shell, state, pid, exit_code, error, created_at, updated_at, started_at, ended_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        dir: { type: string, description: "Where the shell starts, now and on every relaunch." }
        shell: { type: string, description: Absolute path of the shell. }
        state: { $ref: "#/components/schemas/TerminalState" }
        pid: { type: integer, nullable: true, description: "The shell's, while it has one." }
        exit_code:
          type: integer
          nullable: true
          description: Only when exited; 128 and the signal for a shell killed by one.
        error: { type: string, nullable: true, description: Only when failed; why it did not start. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When its state last changed. }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }

    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items: { $ref: "#/components/schemas/Terminal" }

    TerminalEnvelope:
      type: object
      required: [terminal]
      properties:
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalResult:
      type: object
      required: [result, terminal]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        terminal: { $ref: "#/components/schemas/Terminal" }

    TerminalMessage:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          description: The text to type; Enter follows it.

    TerminalHistory:
      type: object
      required: [from, next, first, lines]
      properties:
        from: { type: integer, format: int64, description: The number of the first line in lines. }
        next: { type: integer, format: int64, description: The number the next line written will take. }
        first: { type: integer, format: int64, description: The number of the oldest line kept. }
        lines:
          type: array
          description: The lines as the terminal drew them, with their escape codes for styles and links.
          items: { type: string }

    AgentTranscript:
      type: object
      required: [path, from, next, lines]
      properties:
        path: { type: string, description: "The file on the daemon's machine, whole, for grep." }
        from: { type: integer, format: int64, description: The number of the first line in lines. }
        next: { type: integer, format: int64, description: The number the next line written will take. }
        lines:
          type: array
          description: The lines, oldest first, as Markdown.
          items: { type: string }

    AgentTranscriptEnvelope:
      type: object
      required: [transcript]
      properties:
        transcript: { $ref: "#/components/schemas/AgentTranscript" }

    TerminalHistoryEnvelope:
      type: object
      required: [history]
      properties:
        history: { $ref: "#/components/schemas/TerminalHistory" }

    CreateTerminal:
      type: object
      required: [dir]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; by default the one whose worktree holds dir.
        dir:
          type: string
          description: Absolute path the shell starts in; see createTerminal.
        name:
          type: string
          nullable: true
          description: A generated adjective-noun codename by default; see updateAgent for what a name may hold.

    AgentState:
      type: string
      description: |
        Whether its process is alive, not what its AI coding agent is doing.
        starting: its holder is being started; running: its AI coding agent
        is alive; exited: it ended by itself; stopped: closing its project
        stopped it; failed: it did not start; lost: its holder is gone and
        nobody stopped it; removed: it is a tombstone, kept until its children
        are gone.
      enum: [starting, running, exited, stopped, failed, lost, removed]

    Agent:
      type: object
      required: [id, name, project_id, project_name, parent_agent_id, parent_agent_name, terminal_id, aca, session_id, dir, worktree, state, activity, draft, queued, model, pid, exit_code, error, created_at, updated_at, started_at, ended_at, removed_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        parent_agent_id: { type: string, nullable: true, description: "The agent it was created under; null at the top level." }
        parent_agent_name: { type: string, nullable: true, description: "That agent's name; null at the top level." }
        children:
          type: array
          description: The agents created under it, by name, with their children; set by listAgents, getAgent and getProject only.
          items: { $ref: "#/components/schemas/Agent" }
        terminal_id: { type: string, description: "What holds its process, which attaching dials; no terminal path accepts it." }
        aca: { type: string, description: "Which AI coding agent it runs, as claude_code." }
        session_id: { type: string, description: "The AI coding agent's latest session, which it goes on with when started again; changes when the conversation is cleared." }
        dir: { type: string, description: "Where it starts, now and on every relaunch." }
        worktree: { type: string, nullable: true, description: "The name of the project's worktree holding dir, main for the clone; null when none does." }
        state: { $ref: "#/components/schemas/AgentState" }
        activity:
          type: string
          nullable: true
          enum: [working, idle, waiting, unknown]
          description: What it is doing, while running; otherwise null. Unknown when its screen cannot be read, or its process was started by a wdx too old to say.
        draft: { type: boolean, nullable: true, description: "Whether a human left text in its input box, never the text, while running; otherwise null." }
        queued: { type: integer, nullable: true, description: "How many messages wait to go into it, as behind a draft, while running; otherwise null." }
        model: { type: string, nullable: true, description: "The AI model's name as its ACA last showed it, such as Haiku 5.5, for display, while running; otherwise null, as before it has shown one. A change it does not show, such as an automatic fallback, is not seen." }
        pid: { type: integer, nullable: true, description: "The AI coding agent's, while it has one." }
        exit_code:
          type: integer
          nullable: true
          description: Only when exited; 128 and the signal for one killed by a signal.
        error: { type: string, nullable: true, description: Only when failed; why it did not start. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: When its state last changed. }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true, description: When it was removed, if it is a tombstone. }

    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }

    AgentEnvelope:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }

    AgentMessage:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          description: The text to give the agent; it is submitted.
        instant:
          type: boolean
          description: Go first, and interrupt the agent's turn if it is in one.

    AgentResult:
      type: object
      required: [result, agent]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        agent: { $ref: "#/components/schemas/Agent" }
        worktree_created:
          type: boolean
          description: True when creating the agent created its worktree; left out otherwise.

    UpdateAgent:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Its new name; see updateAgent.

    CreateAgent:
      type: object
      required: [dir]
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: The project's name, or "id:" and its id; by default the one whose worktree holds dir.
        dir:
          type: string
          description: Absolute path it starts in; see createAgent.
        name:
          type: string
          nullable: true
          description: A generated adjective-noun codename by default.
        parent:
          type: string
          nullable: true
          description: The agent to create it under, by "id:" and its id, or its name in the project named by project or holding dir; by default it has no parent.
        worktree:
          type: string
          nullable: true
          description: The worktree to start in, created when there is none of that name; see createAgent.

    ErrorCode:
      type: string
      description: |
        Stable error code; never changed or reused. daemon_unavailable,
        already_running, runtime_missing, port_in_use, runtime_failed,
        agent_not_running, attach_unsupported,
        connection_lost, the
        codes of wdx update (download_failed to restore_required) and of
        wdx deps install (cancelled to privileges_required) are reported
        by the CLI, never by the daemon.
      enum:
        - usage
        - internal
        - not_found
        - name_taken
        - repo_exists
        - checkout_missing
        - not_git_repo
        - invalid_name
        - invalid_path
        - invalid_argument
        - path_exists
        - project_mismatch
        - clone_failed
        - project_closed
        - project_in_use
        - terminal_running
        - start_failed
        - terminal_not_running
        - send_failed
        - agent_running
        - agent_removed
        - branch_exists
        - worktree_failed
        - agent_not_running
        - attach_unsupported
        - connection_lost
        - daemon_unavailable
        - already_running
        - runtime_missing
        - port_in_use
        - runtime_failed
        - download_failed
        - checksum_mismatch
        - older_version
        - update_running
        - update_failed
        - no_previous_version
        - restore_required
        - settings_invalid
        - reload_failed
        - invalid_setting
        - cancelled
        - unsupported_system
        - install_failed
        - privileges_required
        - dependency_missing

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457).
      required: [type, title, status, detail, code, hint, details, debug_id]
      properties:
        type: { type: string, description: "urn:wdx:error: and the code." }
        title: { type: string, description: What the code means. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        hint: { type: string, nullable: true, description: What to do about it. }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: The values involved, such as the conflicting project.
        debug_id: { type: string, description: Finds the request's log lines. }
