openapi: 3.0.3
info:
  title: wdx-hub API
  version: "1"
  description: |
    The API of wdx-hub, served on three endpoints: web, for browsers, on
    listen.web; nodes, for wdx daemons, with mutual TLS on listen.nodes; and
    admin, for wdx-hub's own commands, over the Unix socket
    <home>/wdx-hub.sock. Each operation carries one tag naming the endpoint
    that serves it; another endpoint answers it with 404.

    A request may send a Wdx-Debug-Id header (dbg- and 12 hex digits) to have
    the hub log it under that id; the response echoes the id the request was
    logged under. A Wdx-Log-Level header of debug has the hub log the
    request at debug level, its failures excepted, as for tab completions;
    any other value is ignored.

    Errors are Problem Details (RFC 9457) with a stable "code"; each
    operation lists the codes it can return besides usage and internal.
tags:
  - name: web
    description: Served on the web endpoint, to browsers.
  - name: nodes
    description: Served on the node endpoint, to wdx daemons with a certificate the hub issued.
  - name: admin
    description: Served on the admin socket, to wdx-hub's commands.
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [web]
      summary: Version of the hub
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/node/version:
    get:
      operationId: getNodeVersion
      tags: [nodes]
      summary: Version of the hub, to a node
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/admin/version:
    get:
      operationId: getAdminVersion
      tags: [admin]
      summary: Version of the hub, to its commands
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings:
    get:
      operationId: listSettings
      tags: [admin]
      summary: Every setting, with its value in the config file now
      description: "Errors: reload_failed, when the config file cannot be used."
      responses:
        "200":
          description: The settings, in the order of their table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/{setting}:
    parameters:
      - name: setting
        in: path
        required: true
        description: The setting's dotted key, such as log.level.
        schema: { type: string }
    patch:
      operationId: updateSetting
      tags: [admin]
      summary: Change a setting and apply it at once
      description: |
        The value is checked, saved in the config file, then applied as
        reload applies it, even when it is what the file has. The file is
        written anew, so comments of its own are not kept.

        Errors: invalid_setting, not_found, reload_failed, when the value was
        saved but the hub cannot apply the file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSetting" }
      responses:
        "200":
          description: The setting, with result updated, or unchanged when the file already had it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/reload:
    post:
      operationId: reload
      tags: [admin]
      summary: Read the settings again and apply them
      description: |
        log.level and the otel settings take effect at once; the listeners and
        public_url at the next start. When the config file cannot be used, the
        hub keeps the values it has and fails with reload_failed.
      responses:
        "200":
          description: The settings were applied, with result reloaded, but for those not_applied lists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/backup:
    post:
      operationId: backup
      tags: [admin]
      summary: Copy the database, consistent, while the hub runs
      description: |
        The copy is written on the hub's filesystem, at a path that must not
        exist.

        Errors: path_exists, invalid_argument for a path that is not absolute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Backup" }
      responses:
        "201":
          description: The copy was written, with result backed_up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/invites:
    post:
      operationId: createInvite
      tags: [admin]
      summary: Make an invite, a link that lets one person sign up
      description: |
        The link holds the invite's token: whoever has it can make an account
        until it expires or is used. The hub logs its length, never the link.

        Errors: invalid_argument for a life of 0 or more than 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvite" }
      responses:
        "201":
          description: The invite was made, with result invited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Every user not removed, by username
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getUser
      tags: [admin]
      summary: One user, with their browser sessions counted
      description: "Errors: not_found."
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Disable a user, or enable them again
      description: |
        Disabling ends every browser session of the user, and refuses their
        logins until they are enabled.

        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: The user, with result disabled, enabled, or unchanged when they were so already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeUser
      tags: [admin]
      summary: Remove a user, keeping their username taken
      description: |
        The user's password, second factor, recovery codes, browser sessions,
        resets and invite are deleted; the username is never given again.

        Errors: not_found.
      responses:
        "200":
          description: The user, as they were, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users/{username}/resets:
    parameters:
      - $ref: "#/components/parameters/Username"
    post:
      operationId: createUserReset
      tags: [admin]
      summary: Make a password reset, a link that sets a user's password
      description: |
        The link works for 24 hours and voids an earlier one not used. With
        second_factor, using it also removes the user's authenticator and
        recovery codes, so that their next login enrols a new one. The hub
        logs the link's length, never the link.

        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReset" }
      responses:
        "201":
          description: The reset was made, with result reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/audit/verification:
    get:
      operationId: verifyAudit
      tags: [admin]
      summary: Walk the audit chain, checking every row's hash
      description: |
        Errors: audit_broken, with the first row whose hash does not match in
        its details.
      responses:
        "200":
          description: Every row matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      description: The user's username, whatever its case.
      schema: { type: string }

  responses:
    Version:
      description: The name, version and commit the hub was built from, and the version of this API.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Version" }
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Version:
      type: object
      required: [name, version, commit, api_version]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }
        api_version: { type: string, description: "The info.version of the hub's API." }

    Setting:
      type: object
      required: [key, value, default, description, from, choices, editable]
      properties:
        key: { type: string, description: "Its dotted key, such as log.level." }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        from: { type: string, description: "Where the value comes from: the default, the file and line, or the variable." }
        choices:
          type: array
          nullable: true
          description: The values to choose among, when it takes a fixed set; null when it takes any text or number.
          items: { type: string }
        editable: { type: boolean, description: "False when it is not read from the config file, so it cannot be set here." }

    SettingList:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }

    UpdateSetting:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string, description: "Its new value; empty for the settings that take that." }

    SettingResult:
      type: object
      required: [result, setting, not_applied]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        setting: { $ref: "#/components/schemas/Setting" }
        not_applied: { $ref: "#/components/schemas/NotApplied" }

    ReloadResult:
      type: object
      required: [result, not_applied]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        not_applied: { $ref: "#/components/schemas/NotApplied" }

    NotApplied:
      type: array
      description: |
        The keys of the settings the config file changes that the running hub
        applies only at its next start, such as listen.web and public_url;
        empty when it applied them all.
      items: { type: string }

    Backup:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, description: "Absolute path of the copy, on the hub's filesystem; nothing may be there." }

    BackupResult:
      type: object
      required: [result, path]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        path: { type: string }

    CreateInvite:
      type: object
      additionalProperties: false
      properties:
        expires_seconds:
          type: integer
          format: int64
          description: How long the invite works, in seconds, at most 30 days; 24 hours when left out.

    Invite:
      type: object
      required: [link, expires_at]
      properties:
        link: { type: string, description: "<public_url>/signup?invite=<token>: a secret, for the person invited only." }
        expires_at: { type: string, format: date-time }

    InviteResult:
      type: object
      required: [result, invite]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        invite: { $ref: "#/components/schemas/Invite" }

    CreateReset:
      type: object
      additionalProperties: false
      properties:
        second_factor: { type: boolean, description: "Also remove the user's authenticator and recovery codes; false when left out." }

    Reset:
      type: object
      required: [link, expires_at, second_factor]
      properties:
        link: { type: string, description: "<public_url>/reset?token=<token>: a secret, for the user only." }
        expires_at: { type: string, format: date-time }
        second_factor: { type: boolean }

    ResetResult:
      type: object
      required: [result, reset]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        reset: { $ref: "#/components/schemas/Reset" }

    User:
      type: object
      required: [username, created_at, last_login_at, disabled, second_factor]
      properties:
        username: { type: string }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true, description: "Null when they never logged in." }
        disabled: { type: boolean }
        second_factor:
          type: string
          nullable: true
          description: "Their second factor: totp, or null while none is enrolled."

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [sessions]
          properties:
            sessions: { type: integer, description: "Their browser sessions that have not ended." }

    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }

    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }

    UpdateUser:
      type: object
      required: [disabled]
      additionalProperties: false
      properties:
        disabled: { type: boolean, description: "True disables the user, false enables them." }

    UserResult:
      type: object
      required: [result, user]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        user: { $ref: "#/components/schemas/UserDetail" }

    Audit:
      type: object
      required: [rows, head]
      properties:
        rows: { type: integer, description: "How many rows the chain has." }
        head: { type: string, nullable: true, description: "The last row's hash, in hex; null for an empty chain." }

    AuditEnvelope:
      type: object
      required: [audit]
      properties:
        audit: { $ref: "#/components/schemas/Audit" }

    Result:
      type: string
      description: The most significant thing that happened.
      enum: [updated, unchanged, reloaded, backed_up, invited, disabled, enabled, reset, removed]

    ErrorCode:
      type: string
      description: |
        Stable error code; never changed or reused. already_running,
        hub_unavailable and cancelled are reported by the CLI, never by the
        hub.
      enum:
        - usage
        - internal
        - not_found
        - invalid_argument
        - path_exists
        - invalid_setting
        - reload_failed
        - already_running
        - hub_unavailable
        - audit_broken
        - cancelled

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457).
      required: [type, title, status, detail, code, hint, details, debug_id]
      properties:
        type: { type: string, description: "urn:wdx:error: and the code." }
        title: { type: string, description: What the code means. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        hint: { type: string, nullable: true, description: What to do about it. }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: The values involved, such as the setting.
        debug_id: { type: string, description: Finds the request's log lines. }
