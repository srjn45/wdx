openapi: 3.0.3
info:
  title: wdx-hub API
  version: "1"
  description: |
    The API of wdx-hub, served on three endpoints: web, for browsers, on
    listen.web; nodes, for wdx daemons, with mutual TLS on listen.nodes; and
    admin, for wdx-hub's own commands, over the Unix socket
    <home>/wdx-hub.sock. Each operation carries one tag naming the endpoint
    that serves it; another endpoint answers it with 404.

    A request may send a Wdx-Debug-Id header (dbg- and 12 hex digits) to have
    the hub log it under that id; the response echoes the id the request was
    logged under. A Wdx-Log-Level header of debug has the hub log the
    request at debug level, its failures excepted, as for tab completions;
    any other value is ignored.

    A node sends Wdx-Api-Version, the info.version of this spec it was
    built with, on every request. The hub serves every version from the
    oldest it keeps, 1, up, newer ones included: the newer side decides
    what it can use. A version below the oldest, or one that is no whole
    number, is refused before the request is checked, with
    node_version_unsupported. A request without the header, from a browser
    or wdx-hub's own commands, is served.

    Errors are Problem Details (RFC 9457) with a stable "code"; each
    operation lists the codes it can return besides usage and internal.
tags:
  - name: web
    description: Served on the web endpoint, to browsers.
  - name: nodes
    description: Served on the node endpoint, to wdx daemons with a certificate the hub issued.
  - name: admin
    description: Served on the admin socket, to wdx-hub's commands.
paths:
  /v1/version:
    get:
      operationId: getVersion
      tags: [web]
      summary: Version of the hub
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/node/version:
    get:
      operationId: getNodeVersion
      tags: [nodes]
      summary: Version of the hub, to a node
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/admin/version:
    get:
      operationId: getAdminVersion
      tags: [admin]
      summary: Version of the hub, to its commands
      responses:
        "200": { $ref: "#/components/responses/Version" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings:
    get:
      operationId: listSettings
      tags: [admin]
      summary: Every setting, with its value in the config file now
      description: "Errors: reload_failed, when the config file cannot be used."
      responses:
        "200":
          description: The settings, in the order of their table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/{setting}:
    parameters:
      - name: setting
        in: path
        required: true
        description: The setting's dotted key, such as log.level.
        schema: { type: string }
    patch:
      operationId: updateSetting
      tags: [admin]
      summary: Change a setting and apply it at once
      description: |
        The value is checked, saved in the config file, then applied as
        reload applies it, even when it is what the file has. The file is
        written anew, so comments of its own are not kept.

        Errors: invalid_setting, not_found, reload_failed, when the value was
        saved but the hub cannot apply the file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSetting" }
      responses:
        "200":
          description: The setting, with result updated, or unchanged when the file already had it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/reload:
    post:
      operationId: reload
      tags: [admin]
      summary: Read the settings again and apply them
      description: |
        log.level and the otel settings take effect at once; the listeners and
        public_url at the next start. When the config file cannot be used, the
        hub keeps the values it has and fails with reload_failed.
      responses:
        "200":
          description: The settings were applied, with result reloaded, but for those not_applied lists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/backup:
    post:
      operationId: backup
      tags: [admin]
      summary: Copy the database, consistent, while the hub runs
      description: |
        The copy is written on the hub's filesystem, at a path that must not
        exist.

        Errors: path_exists, invalid_argument for a path that is not absolute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Backup" }
      responses:
        "201":
          description: The copy was written, with result backed_up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/invites:
    post:
      operationId: createInvite
      tags: [admin]
      summary: Make an invite, a link that lets one person sign up
      description: |
        The link holds the invite's token: whoever has it can make an account
        until it expires or is used. The hub logs its length, never the link.

        Errors: invalid_argument for a life of 0 or more than 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvite" }
      responses:
        "201":
          description: The invite was made, with result invited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Every user not removed, by username
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getUser
      tags: [admin]
      summary: One user, with their browser sessions counted and their nodes
      description: "Errors: not_found."
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Disable a user, or enable them again
      description: |
        Disabling ends every browser session of the user, cuts their nodes
        off, and refuses their logins and their nodes until they are enabled.

        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: The user, with result disabled, enabled, or unchanged when they were so already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResult" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeUser
      tags: [admin]
      summary: Remove a user, keeping their username taken
      description: |
        The user's password, second factor, recovery codes, browser sessions,
        resets, invite and nodes are deleted, their nodes cut off; the
        username is never given again.

        Errors: not_found.
      responses:
        "200":
          description: The user, as they were, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/users/{username}/resets:
    parameters:
      - $ref: "#/components/parameters/Username"
    post:
      operationId: createUserReset
      tags: [admin]
      summary: Make a password reset, a link that sets a user's password
      description: |
        The link works for 24 hours and voids an earlier one not used. With
        second_factor, using it also removes the user's authenticator and
        recovery codes, so that their next login enrols a new one. The hub
        logs the link's length, never the link.

        Errors: not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReset" }
      responses:
        "201":
          description: The reset was made, with result reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/audit/verification:
    get:
      operationId: verifyAudit
      tags: [admin]
      summary: Walk the audit chain, checking every row's hash
      description: |
        Errors: audit_broken, with the first row whose hash does not match in
        its details.
      responses:
        "200":
          description: Every row matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/node-logins:
    post:
      operationId: startNodeLogin
      tags: [web]
      summary: Start making a machine one of an account's nodes
      description: |
        Two flows. browser: the person opens login_url on the machine, logs
        in and approves the node; the hub then sends their browser to
        callback, which must be on http://127.0.0.1, with code and state, the
        login's id, and the node exchanges the code at
        /v1/node-logins/exchange with its PKCE verifier. device: the person
        types user_code on verification_url, from any browser, and the node
        polls /v1/node-logins/token with device_code every interval seconds.
        Either expires 10 minutes after it started. Starting logins is rate
        limited per address.

        device_code and user_code are secrets: the hub logs their length.

        Errors: invalid_argument, rate_limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartNodeLogin" }
      responses:
        "201":
          description: The login started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeLoginStarted" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/node-logins/exchange:
    post:
      operationId: exchangeNodeLogin
      tags: [web]
      summary: Exchange a browser login's authorization code for the node's credentials
      description: |
        The code works once. The hub logs the length of the code and of the
        verifier, never them.

        Errors: not_found, for a code that is unknown, used or expired;
        invalid_grant, for a verifier that is not the challenge's;
        account_disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeNodeLogin" }
      responses:
        "200":
          description: The node's credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCredentials" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/node-logins/token:
    post:
      operationId: pollNodeLogin
      tags: [web]
      summary: Ask whether a device login was approved, as RFC 8628 has it
      description: |
        Polled every interval seconds until it answers with the credentials,
        once, or fails with anything but authorization_pending and
        slow_down. The hub logs the device code's length, never it.

        Errors: authorization_pending, not approved yet; slow_down, polled
        faster than interval, which the node then raises by 5 seconds;
        access_denied; expired_token; not_found, for a device code unknown
        or used; account_disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollNodeLogin" }
      responses:
        "200":
          description: The node's credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCredentials" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/control:
    get:
      operationId: openControl
      tags: [nodes]
      summary: The node's control WebSocket
      description: |
        Upgraded to a WebSocket of JSON text messages, each an object with a
        type: the node sends ControlHello first, and the hub answers
        ControlWelcome, or closes with status 4001 when the node's API
        version is older than the oldest the hub serves, its reason node,
        the side behind (hub_version_unsupported); a node newer than the
        hub is welcomed, and decides from the welcome's api_version what it
        can use. An older hub may close with the reason hub for a node newer
        than itself. The hub then sends
        ControlCertificate when two thirds of the node's certificate's life
        have passed, at the welcome and daily, which the node answers with
        ControlCertificateSaved once it wrote it, ControlStreamWaiting when
        another node asks for a stream to it, ControlNodeRemoved when
        another node of the account is removed from it, and ControlBye
        before it closes the connection. The node sends ControlState at each connect
        and whenever it changes. WebSocket pings keep it alive.

        Errors: node_revoked, account_disabled, as on every request of this
        endpoint.
      responses:
        "101":
          description: Switched to the WebSocket.
        default: { $ref: "#/components/responses/Problem" }

  /v1/streams:
    post:
      operationId: openStream
      tags: [nodes]
      summary: Ask for a stream to another node of the calling node's account
      description: |
        The hub sends the node asked for a ControlStreamWaiting on its
        control connection, and answers with the stream's id, which both
        nodes then join with GET /v1/streams/{id}. The hub copies the bytes
        between them and cannot read them: what runs in a stream is the two
        nodes' own.

        Errors: node_not_found, a node the account does not have, or the
        caller; node_offline, a node without a control connection now;
        too_many_streams, an account with 32 streams open or waiting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenStream" }
      responses:
        "201":
          description: The stream, waiting for both nodes to join it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamEnvelope" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/streams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The stream's id, as POST /v1/streams answered it.
        schema: { type: string }
    get:
      operationId: joinStream
      tags: [nodes]
      summary: Join a stream, as a WebSocket of binary messages
      description: |
        Each of the stream's two nodes joins it once. The hub answers the
        first to join once the second did, both switched to a WebSocket,
        and copies binary messages both ways until either closes, which
        closes the other. A text message closes both.

        Errors: not_found, a stream unknown, expired, of two other nodes,
        or joined by this node already; node_offline, the other node not
        joined within 10 seconds of the stream asked for.
      responses:
        "101":
          description: Switched to the WebSocket, joined to the other node's.
        default: { $ref: "#/components/responses/Problem" }

  /v1/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: The nodes of the calling node's account, by name
      responses:
        "200":
          description: The nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountNodeList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/nodes/{node}:
    parameters:
      - name: node
        in: path
        required: true
        description: "The node's name, whatever its case, or id: and its id."
        schema: { type: string }
    get:
      operationId: getNode
      tags: [nodes]
      summary: One node of the calling node's account
      description: "Errors: not_found."
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountNodeEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeNode
      tags: [nodes]
      summary: Revoke a node of the calling node's account, the caller among them
      description: |
        The node's connections are cut at once and it can never connect
        again; its name is free for another node.

        Errors: not_found.
      responses:
        "200":
          description: The node, as it was, with result removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountNodeResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/docs/changes:
    post:
      operationId: pushDocChanges
      tags: [nodes]
      summary: Apply changes of the calling node's docs, in order
      description: |
        Each change is applied once, in a transaction of its own, by the
        doc's id and revision: a change already applied is acknowledged
        again and nothing is written, so a batch sent again after a lost
        answer does nothing twice. A doc's revisions are sealed at rest
        under a data key of its own, which master_key seals. A body over
        8 MiB is refused whole with usage.

        Each change is answered applied or refused with its code:
        revision_gap, a revision that is not the doc's next;
        revision_conflict, a revision the hub has with another text;
        doc_too_large, content that unpacks to more than 2 MiB;
        doc_name_taken, a name another of the user's docs of its kind in
        that repository has; not_found, a doc the hub does not have, or
        another user's; invalid_argument, a change that lacks what its kind
        needs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocChanges" }
      responses:
        "200":
          description: One result per change, in the order sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocChangeResults" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      description: The user's username, whatever its case.
      schema: { type: string }

  responses:
    Version:
      description: The name, version and commit the hub was built from, and the version of this API.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Version" }
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Version:
      type: object
      required: [name, version, commit, api_version]
      properties:
        name: { type: string }
        version: { type: string }
        commit: { type: string }
        api_version: { type: string, description: "The info.version of the hub's API." }

    Setting:
      type: object
      required: [key, value, default, description, from, choices, editable]
      properties:
        key: { type: string, description: "Its dotted key, such as log.level." }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        from: { type: string, description: "Where the value comes from: the default, the file and line, or the variable." }
        choices:
          type: array
          nullable: true
          description: The values to choose among, when it takes a fixed set; null when it takes any text or number.
          items: { type: string }
        editable: { type: boolean, description: "False when it is not read from the config file, so it cannot be set here." }

    SettingList:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }

    UpdateSetting:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string, description: "Its new value; empty for the settings that take that." }

    SettingResult:
      type: object
      required: [result, setting, not_applied]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        setting: { $ref: "#/components/schemas/Setting" }
        not_applied: { $ref: "#/components/schemas/NotApplied" }

    ReloadResult:
      type: object
      required: [result, not_applied]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        not_applied: { $ref: "#/components/schemas/NotApplied" }

    NotApplied:
      type: array
      description: |
        The keys of the settings the config file changes that the running hub
        applies only at its next start, such as listen.web and public_url;
        empty when it applied them all.
      items: { type: string }

    Backup:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, description: "Absolute path of the copy, on the hub's filesystem; nothing may be there." }

    BackupResult:
      type: object
      required: [result, path]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        path: { type: string }

    CreateInvite:
      type: object
      additionalProperties: false
      properties:
        expires_seconds:
          type: integer
          format: int64
          minimum: 1
          description: How long the invite works, in seconds, at most 30 days; 24 hours when left out.

    Invite:
      type: object
      required: [link, expires_at]
      properties:
        link: { type: string, description: "<public_url>/signup?invite=<token>: a secret, for the person invited only." }
        expires_at: { type: string, format: date-time }

    InviteResult:
      type: object
      required: [result, invite]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        invite: { $ref: "#/components/schemas/Invite" }

    CreateReset:
      type: object
      additionalProperties: false
      properties:
        second_factor: { type: boolean, description: "Also remove the user's authenticator and recovery codes; false when left out." }

    Reset:
      type: object
      required: [link, expires_at, second_factor]
      properties:
        link: { type: string, description: "<public_url>/reset?token=<token>: a secret, for the user only." }
        expires_at: { type: string, format: date-time }
        second_factor: { type: boolean }

    ResetResult:
      type: object
      required: [result, reset]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        reset: { $ref: "#/components/schemas/Reset" }

    StartNodeLogin:
      type: object
      required: [flow, name, os, wdx_version, public_key]
      additionalProperties: false
      properties:
        flow: { $ref: "#/components/schemas/NodeLoginFlow" }
        name: { type: string, description: "The node's name in the account: 1 to 64 letters, digits, ., _ and -, starting with a letter or digit." }
        os: { type: string, maxLength: 64, description: "The node's operating system and architecture, such as linux/amd64." }
        wdx_version: { type: string, maxLength: 64 }
        public_key: { type: string, format: byte, description: "The node's Ed25519 public key, 32 bytes in base64." }
        pkce_challenge: { type: string, description: "browser only: the S256 challenge of the node's PKCE verifier, in base64url without padding." }
        callback: { type: string, description: "browser only: where the browser goes once the node is approved, http://127.0.0.1:<port>/<path>." }

    NodeLoginFlow:
      type: string
      enum: [browser, device]

    NodeLoginStarted:
      type: object
      required: [flow, expires_at, login_url, device_code, user_code, verification_url, interval]
      properties:
        flow: { $ref: "#/components/schemas/NodeLoginFlow" }
        expires_at: { type: string, format: date-time }
        login_url: { type: string, nullable: true, description: "browser: the approval page the node opens; null for device." }
        device_code: { type: string, nullable: true, description: "device: the secret the node polls with; null for browser." }
        user_code: { type: string, nullable: true, description: "device: the code the person types, such as WDX-4F7K-9QPA; null for browser." }
        verification_url: { type: string, nullable: true, description: "device: the page the person types it on, which never carries it; null for browser." }
        interval: { type: integer, nullable: true, description: "device: the seconds between two polls; null for browser." }

    ExchangeNodeLogin:
      type: object
      required: [code, pkce_verifier]
      additionalProperties: false
      properties:
        code: { type: string, description: "The authorization code the browser brought to the callback." }
        pkce_verifier: { type: string }

    PollNodeLogin:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code: { type: string }

    NodeRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    NodeCredentials:
      type: object
      required: [node, user, certificate, ca_certificate, nodes_url]
      properties:
        node: { $ref: "#/components/schemas/NodeRef" }
        user: { type: string, description: "The account's username." }
        certificate: { type: string, description: "The node's certificate in PEM, for the public key the login started with, valid a year." }
        ca_certificate: { type: string, description: "The hub's CA in PEM, the only one the node endpoint is trusted by." }
        nodes_url: { type: string, description: "The node endpoint, https://<host>:<port>." }

    Node:
      type: object
      required: [id, name, os, version, created_at, last_seen_at, online, remote_access, code_setup]
      properties:
        id: { type: string }
        name: { type: string }
        os: { type: string }
        version: { type: string, description: "The wdx version it last connected with." }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true, description: "Null when it never connected." }
        online: { type: boolean, description: "Whether it has a control connection now." }
        remote_access: { type: boolean, description: "Whether it allows sessions, as it last said; for display only, the node decides each session itself." }
        code_setup: { type: boolean, description: "Whether it has an authenticator set up for sessions, as it last said." }

    AccountNode:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [this]
          properties:
            this: { type: boolean, description: "Whether it is the node asking." }

    AccountNodeDetail:
      allOf:
        - $ref: "#/components/schemas/AccountNode"
        - type: object
          required: [public_key, fingerprint]
          properties:
            public_key: { type: string, format: byte, description: "Its Ed25519 public key, in base64." }
            fingerprint: { type: string, description: "SHA256: and the key's SHA-256 in base64 without padding." }

    AccountNodeList:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/AccountNode" }

    AccountNodeEnvelope:
      type: object
      required: [node]
      properties:
        node: { $ref: "#/components/schemas/AccountNodeDetail" }

    AccountNodeResult:
      type: object
      required: [result, node]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        node: { $ref: "#/components/schemas/AccountNode" }

    ControlHello:
      type: object
      description: The node's first message on the control WebSocket.
      required: [type, api_version, wdx_version, os]
      properties:
        type: { type: string, enum: [hello] }
        api_version: { type: string, description: "The info.version of the hub.yaml the node was built with." }
        wdx_version: { type: string }
        os: { type: string }

    ControlWelcome:
      type: object
      description: The hub's answer to a hello it can serve.
      required: [type, hub_version, api_version, node]
      properties:
        type: { type: string, enum: [welcome] }
        hub_version: { type: string }
        api_version: { type: string, description: "The info.version of the hub's API." }
        node: { $ref: "#/components/schemas/NodeRef" }
        nodes_url:
          type: string
          description: |
            Where nodes reach the node endpoint now, its nodes_url. A node
            whose login names another address writes this one in its place,
            so that the hub can move while its nodes stay logged in. An
            older hub sends none.

    ControlCertificate:
      type: object
      description: A new certificate of the node, for its key.
      required: [type, certificate, expires_at]
      properties:
        type: { type: string, enum: [certificate] }
        certificate: { type: string, description: "In PEM." }
        expires_at: { type: string, format: date-time }

    ControlCertificateSaved:
      type: object
      description: The node wrote the certificate whose expiry it names.
      required: [type, expires_at]
      properties:
        type: { type: string, enum: [certificate_saved] }
        expires_at: { type: string, format: date-time }

    ControlBye:
      type: object
      description: Why the hub closes the connection; revoked and disabled mean for good.
      required: [type, reason]
      properties:
        type: { type: string, enum: [bye] }
        reason: { type: string, enum: [revoked, disabled, shutting_down] }

    ControlStreamWaiting:
      type: object
      description: Another node of the account asked for a stream to this one, which this one joins with GET /v1/streams/{id}.
      required: [type, stream, node]
      properties:
        type: { type: string, enum: [stream_waiting] }
        stream: { type: string, description: "The stream's id." }
        node: { $ref: "#/components/schemas/NodeRef" }

    ControlNodeRemoved:
      type: object
      description: |
        Another node of the account was removed from it, by logout or by
        another node, and can never connect again: this node closes its
        sessions with it and forgets its key. A node that was not connected
        then learns it from GET /v1/nodes after its next welcome.
      required: [type, node]
      properties:
        type: { type: string, enum: [node_removed] }
        node: { $ref: "#/components/schemas/NodeRef" }

    ControlState:
      type: object
      description: What the node says of itself, at each connect and whenever it changes; the hub keeps it for display.
      required: [type, remote_access, code_setup]
      properties:
        type: { type: string, enum: [state] }
        remote_access: { type: boolean }
        code_setup: { type: boolean }

    ControlMessage:
      type: object
      description: What every control message has, to tell which it is.
      required: [type]
      properties:
        type: { type: string }

    OpenStream:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: { type: string, minLength: 1, description: "The id of the node to open the stream to." }

    Stream:
      type: object
      required: [id, node]
      properties:
        id: { type: string }
        node: { $ref: "#/components/schemas/NodeRef" }

    StreamEnvelope:
      type: object
      required: [stream]
      properties:
        stream: { $ref: "#/components/schemas/Stream" }

    DocChanges:
      type: object
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/DocChange" }

    DocChange:
      type: object
      description: |
        One change of a doc, as the node's outbox has it. revision and
        metadata carry the doc's metadata as it is when pushed, removed only
        its id.
      required: [seq, doc_id, change]
      additionalProperties: false
      properties:
        seq: { type: integer, format: int64, description: "The outbox row's number, echoed in its result." }
        doc_id: { type: string, minLength: 1 }
        change: { $ref: "#/components/schemas/DocChangeType" }
        repo_key: { type: string, description: "The project's repository key now; the doc moves to it." }
        kind: { $ref: "#/components/schemas/DocKind" }
        name: { type: string }
        folder: { type: string }
        format: { type: string }
        labels: { type: array, items: { type: string } }
        status: { type: string }
        revision: { type: integer, description: "revision only: the revision the content is, 1 for a new doc." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        content: { type: string, format: byte, description: "revision only: the revision's text gzipped, in base64; at most 2 MiB once unpacked." }
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            revision only: the sha256 of the revision's text, unpacked, in
            lowercase hex. The hub stores it with the revision, and refuses
            with revision_conflict another text under a revision it has. One
            that is not the content's hash is invalid_argument.

    DocChangeType:
      type: string
      enum: [revision, metadata, removed]

    DocKind:
      type: string
      enum: [doc, plan]

    DocChangeResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/DocChangeResult" }

    DocChangeResult:
      type: object
      required: [seq, status, code]
      properties:
        seq: { type: integer, format: int64 }
        status: { type: string, enum: [applied, refused] }
        code:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
          description: "Why it was refused; null when applied."

    User:
      type: object
      required: [username, created_at, last_login_at, disabled, second_factor, nodes]
      properties:
        username: { type: string }
        nodes: { type: integer, description: "Their nodes not removed." }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true, description: "Null when they never logged in." }
        disabled: { type: boolean }
        second_factor:
          type: string
          nullable: true
          description: "Their second factor: totp, or null while none is enrolled."

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [sessions, node_list]
          properties:
            sessions: { type: integer, description: "Their browser sessions that have not ended." }
            node_list:
              type: array
              description: Their nodes not removed, by name.
              items: { $ref: "#/components/schemas/Node" }

    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }

    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }

    UpdateUser:
      type: object
      required: [disabled]
      additionalProperties: false
      properties:
        disabled: { type: boolean, description: "True disables the user, false enables them." }

    UserResult:
      type: object
      required: [result, user]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        user: { $ref: "#/components/schemas/UserDetail" }

    Audit:
      type: object
      required: [rows, head]
      properties:
        rows: { type: integer, description: "How many rows the chain has." }
        head: { type: string, nullable: true, description: "The last row's hash, in hex; null for an empty chain." }

    AuditEnvelope:
      type: object
      required: [audit]
      properties:
        audit: { $ref: "#/components/schemas/Audit" }

    Result:
      type: string
      description: The most significant thing that happened.
      enum: [updated, unchanged, reloaded, backed_up, invited, disabled, enabled, reset, removed]

    ErrorCode:
      type: string
      description: |
        Stable error code; never changed or reused. already_running,
        hub_unavailable and cancelled are reported by the CLI, never by the
        hub, and so are the codes of wdx-hub update, from download_failed
        on.
      enum:
        - usage
        - internal
        - not_found
        - invalid_argument
        - path_exists
        - invalid_setting
        - reload_failed
        - already_running
        - hub_unavailable
        - audit_broken
        - cancelled
        - name_taken
        - rate_limited
        - node_revoked
        - account_disabled
        - hub_version_unsupported
        - node_version_unsupported
        - invalid_grant
        - authorization_pending
        - slow_down
        - access_denied
        - expired_token
        - revision_gap
        - revision_conflict
        - doc_too_large
        - doc_name_taken
        - node_not_found
        - node_offline
        - too_many_streams
        - download_failed
        - checksum_mismatch
        - older_version
        - update_running
        - update_failed
        - no_previous_version
        - restore_required
        - settings_invalid
        - root_required
        - not_installed
        - update_source_untrusted
        - home_unsafe

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457).
      required: [type, title, status, detail, code, hint, details, debug_id]
      properties:
        type: { type: string, description: "urn:wdx:error: and the code." }
        title: { type: string, description: What the code means. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        hint: { type: string, nullable: true, description: What to do about it. }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: The values involved, such as the setting.
        debug_id: { type: string, description: Finds the request's log lines. }
