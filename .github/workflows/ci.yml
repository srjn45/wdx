# The tests and every other check, as make runs them locally. The checks
# run beside the tests, the slowest part. docs/RELEASING.md: release.yml
# runs it on a tag before publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly, for vulnerabilities published since the last push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A user systemd lets make cap the tests' memory as on a developer's
      # machine: a test that grows past it fails here instead.
      - name: Start a user systemd
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >>"$GITHUB_ENV"
          for _ in $(seq 50); do
            systemd-run --user --scope -q true 2>/dev/null && exit 0
            sleep 0.2
          done
          echo "error: no user systemd to cap the tests' memory" >&2
          exit 1
      - run: make cover
      - run: make test-update
      - name: Coverage summary
        run: scripts/cover.sh bin/cover.out >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            bin/cover.out
            bin/cover.html

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits to check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'scripts/fetch-*.sh') }}
          # The tools are named by version: an older cache lacks only those
          # whose pin changed.
          restore-keys: tools-${{ runner.os }}-
      # The commits of the PR or of the push to main; none on other runs, a
      # tag's included: they were checked on main. A push whose before is
      # not in the history, as after a force push, checks its last commit.
      - name: Choose the commits to check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range=HEAD..HEAD
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" = push ] && [ "${REF#refs/heads/}" != "$REF" ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..$SHA"
            else
              range="$SHA~1..$SHA"
            fi
          fi
          echo "RANGE=$range" >>"$GITHUB_ENV"
      - run: make check
