# The tests run over and over, nightly: a test that fails only now and then
# fails here before it fails a push. AGENTS.md says how tests stay
# deterministic.
name: Stress

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Times each test runs, at each CPU count
        default: "3"
      pkg:
        description: Packages to run
        default: ./...

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # As in ci.yml: a user systemd lets make cap the tests' memory.
      - name: Start a user systemd
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >>"$GITHUB_ENV"
          for _ in $(seq 50); do
            systemd-run --user --scope -q true 2>/dev/null && exit 0
            sleep 0.2
          done
          echo "error: no user systemd to cap the tests' memory" >&2
          exit 1
      - run: make test-stress COUNT="$COUNT" PKG="$PKG"
        env:
          COUNT: ${{ inputs.count || '3' }}
          PKG: ${{ inputs.pkg || './...' }}
      - run: make test-contention PKG="$PKG"
        env:
          PKG: ${{ inputs.pkg || './...' }}
      # With wdx's real limits on how long its processes wait for each other:
      # what fails only here is what a user on a loaded machine could hit. It
      # says so without failing the night's run; such a failure goes in
      # docs/FLAKES.md.
      - id: production-limits
        run: make test
        continue-on-error: true
        env:
          WDX_TEST_PRODUCTION_LIMITS: "1"
      # A red run nobody opens finds nothing: one open issue collects them.
      - name: Open an issue
        if: github.event_name == 'schedule' && (failure() || steps.production-limits.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly stress run failed"
          body="$RUN: add what failed to docs/FLAKES.md, and never answer by retrying it."
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
