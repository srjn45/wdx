# Runs wdx-hub on this machine, its home in the named volume hub-data:
#
#   export WDX_HUB_MASTER_KEY=$(head -c 32 /dev/urandom | base64) # once; keep it
#   docker compose -f deploy/hub/compose.yaml up --build
#
# Every setting can be given here as WDX_HUB_<KEY>; wdx-hub help settings lists them.
services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
        COMMIT: ${COMMIT:-none}
    environment:
      WDX_HUB_PUBLIC_URL: http://localhost:8080
      # The same key at every start: the secrets the hub sealed are lost with it.
      WDX_HUB_MASTER_KEY: ${WDX_HUB_MASTER_KEY:?make one with: head -c 32 /dev/urandom | base64}
      WDX_HUB_LISTEN_WEB: ":8080"
      WDX_HUB_LISTEN_NODES: ":8443"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - hub-data:/data
    restart: unless-stopped

volumes:
  hub-data:
