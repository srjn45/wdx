# git-cliff: the next version and CHANGELOG.md, both from the commits.
# docs/RELEASING.md explains the rules.

[changelog]
header = """
# Changelog

Every release of wdx, generated from the commits by git-cliff: do not edit.
"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
# Only stable tags are versions: the commits of dev releases belong to the
# stable release that follows them.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
]

[bump]
# Before 1.0 a breaking change bumps the minor version, as does a feature.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
